/* ---------- tap a word: its meaning in this sentence ---------- */
function wordRange(pEl, start, end){
  var r=document.createRange(), pos=0, w=document.createTreeWalker(pEl, NodeFilter.SHOW_TEXT), n, set=false;
  while((n=w.nextNode())){
    var L=n.nodeValue.length;
    if(!set && start<=pos+L){ r.setStart(n, start-pos); set=true; }
    if(set && end<=pos+L){ r.setEnd(n, end-pos); return r; }
    pos+=L;
  }
  return null;
}
function wordAt(e, at){
  var pEl=e.target.closest && e.target.closest('#passage p[data-p]'); if(!pEl) return null;
  var node=null, off=0;
  if(document.caretPositionFromPoint){ var cp=document.caretPositionFromPoint(e.clientX,e.clientY); if(cp){ node=cp.offsetNode; off=cp.offset; } }
  else if(document.caretRangeFromPoint){ var cr=document.caretRangeFromPoint(e.clientX,e.clientY); if(cr){ node=cr.startContainer; off=cr.startOffset; } }
  if(!node || node.nodeType!==3 || !pEl.contains(node)) return null;
  var pi=Number(pEl.dataset.p), text=at.passage.paragraphs[pi]||'', i=offsetIn(pEl,node,off);
  var isL=function(c){ return !!c && /[A-Za-zÀ-ɏ0-9]/.test(c); }, isJ=function(c){ return !!c && /['’-]/.test(c); };
  if(!isL(text[i]) && isL(text[i-1])) i--;
  if(!isL(text[i])) return null;
  var s=i, en=i+1;
  while(s>0 && (isL(text[s-1]) || (isJ(text[s-1]) && isL(text[s-2])))) s--;
  while(en<text.length && (isL(text[en]) || (isJ(text[en]) && isL(text[en+1])))) en++;
  var word=text.slice(s,en).replace(/['’]s$/,'');
  if(!/[A-Za-z]/.test(word)) return null;
  en=s+word.length;
  var rg=wordRange(pEl,s,en);
  if(rg){ var hit=[].some.call(rg.getClientRects(), function(b){ return e.clientX>=b.left-4 && e.clientX<=b.right+4 && e.clientY>=b.top-4 && e.clientY<=b.bottom+4; }); if(!hit) return null; }
  return {p:pi, start:s, end:en, word:word};
}
function sentenceOf(text, s, e){
  var a=s, b=e; while(a>0 && !/[.!?]/.test(text[a-1])) a--; while(b<text.length && !/[.!?]/.test(text[b])) b++;
  return text.slice(a, Math.min(text.length,b+1)).trim();
}
function wKey(w){ return w.p+':'+w.start+':'+String(w.word).toLowerCase(); }
function curAt(){ return S.route.name==='review' ? S.review : S.attempt; }
function openWord(at, w, marks){
  at.defs=at.defs||{}; at.wordMark=w;
  at.sheet={kind:'word', w:w, u:marks&&marks.u, a:marks&&marks.a, key:wKey(w)};
  redrawPassage(false); drawSheet();
  if(at.defs[at.sheet.key]) return;
  lookUp(at, w);
}
function lookUp(at, w){
  var k=wKey(w), text=at.passage.paragraphs[w.p]||'';
  at.sheet.err=null; drawSheet();
  call('define',{pid:at.passage.id, p:w.p, start:w.start, end:w.end, text:w.word, sentence:sentenceOf(text,w.start,w.end), title:at.passage.title}).then(function(d){
    at.defs[k]=d;
    if(!at.preview && !at.result && S.attempt===at){
      at.words=(at.words||[]).filter(function(x){ return String(x.w.word).toLowerCase()!==String(w.word).toLowerCase(); });
      at.words.unshift({w:w, d:d}); at.words=at.words.slice(0,30); saveDraft();
    } else if(at.result || at.preview){
      at.words=(at.words||[]).filter(function(x){ return String(x.w.word).toLowerCase()!==String(w.word).toLowerCase(); }); at.words.unshift({w:w,d:d}); at.words=at.words.slice(0,30);
    }
    if(at.sheet && at.sheet.key===k) drawSheet();
    drawWords();
  }).catch(function(e){ if(at.sheet && at.sheet.key===k){ at.sheet.err=e.message; drawSheet(); } });
}
function wordSheet(sh){

/* selection tracking */
function paraOf(node){ while(node && node.nodeType!==1) node=node.parentNode; return node ? node.closest('p[data-p]') : null; }
function offsetIn(pEl, node, off){ var r=document.createRange(); r.selectNodeContents(pEl); r.setEnd(node,off); return r.toString().length; }
document.addEventListener('selectionchange', function(){
  if(S.route.name!=='attempt' || !S.attempt || S.attempt.result) return;
  var sel=getSelection(); if(!sel || !sel.rangeCount || sel.isCollapsed) return;
  var rg=sel.getRangeAt(0);
  var pa=paraOf(rg.startContainer); if(!pa) return;
  var pi=Number(pa.dataset.p);
  var start=offsetIn(pa, rg.startContainer, rg.startOffset);
  var pb=paraOf(rg.endContainer);
  var end = (pb===pa) ? offsetIn(pa, rg.endContainer, rg.endOffset) : S.attempt.passage.paragraphs[pi].length;
  var text=S.attempt.passage.paragraphs[pi];
  while(start<end && /\s/.test(text[start])) start++;
  while(end>start && /\s/.test(text[end-1])) end--;
  if(end<=start) return;
  S.attempt.sel={p:pi,start:start,end:end,at:Date.now()};
  var hint=$('#selhint'); if(hint){ var t=text.slice(start,end); hint.innerHTML='Selected: <b>“'+esc(t.length>60?t.slice(0,57)+'…':t)+'”</b> — now pick a colour.'; }
});
function takeSel(){
  var s=S.attempt && S.attempt.sel;
  if(!s || Date.now()-s.at>60000){ toast('Select some words in the passage first.'); return null; }
  return s;
}
function clearSel(){ S.attempt.sel=null; try{ getSelection().removeAllRanges(); }catch(e){} var hint=$('#selhint'); if(hint) hint.textContent=SEL_HINT; }

/* ---------- submit ---------- */
function submitAttempt(){
  var at=S.attempt, p=at.passage;
  var blank=p.questions.filter(function(q){ var a=at.answers[q.id]; if(a===undefined||a===''||a===null) return true; if(typeof a==='object') return !Object.keys(a).length; return false; }).length;
  if(!at.confirming){
    at.confirming=true; render();
    var n=$('#submitNote'); if(n) n.innerHTML = blank ? '<b>'+blank+' question'+(blank>1?'s are':' is')+' still blank.</b> Check your work, then tap again to hand in.' : 'All questions answered. Tap again to hand in.';
    var btn=document.querySelector('[data-act=submit]'); if(btn) btn.scrollIntoView({block:'center'});
    return;
  }
  at.confirming=false;
  var b=busy('Marking your answers',['Handing in','Checking each answer against the answer key','Finding the clues in the passage'],'Your teacher\'s AI marker is reading your work.');
  setTimeout(function(){ b.step(1); }, 1200);
  setTimeout(function(){ b.step(2); }, 12000);
  call('submit',{passageId:p.id, student:S.student.name, cls:S.student.cls, answers:at.answers, annos:at.annos}).then(function(r){
    b.done();
    LS.del(draftKey(p.id));
    S.results=[r].concat((S.results||[]).filter(function(x){ return x.id!==r.id; }));
    at.passage=r.passage||at.passage; at.result=r; at.tab='questions'; at.clue=null;
    render(); window.scrollTo(0,0);
  }).catch(function(e){ b.done(); at.err=e.message; render(); var el=$('.err'); if(el) el.scrollIntoView({block:'center'}); });
}

function showClue(qid, part){
  var at=S.route.name==='review' ? S.review : S.attempt;
  var m=(at.result||at.sub||{}).marks||{}; var mq=m[qid]||{};
  var quote = part!=null ? ((mq.parts||{})[part]||{}).clue : mq.clue;
  if(!quote){
    var q=at.passage.questions.filter(function(x){ return x.id===qid; })[0];
    if(q){ if(part!=null && q.parts){ var pt=q.parts.filter(function(x){ return x.id===part; })[0]; quote=pt&&pt.clue; }
           else if(part!=null && q.statements){ var st=q.statements[Number(String(part).slice(1))]; quote=st&&st.clue; }
           if(!quote) quote=q.clue; }
  }
  var loc=findClue(at.passage.paragraphs, quote);
  if(!loc){ toast('The clue could not be found in the passage.'); return; }
  at.clue=loc;
  if(at.tab!=='passage' && matchMedia('(max-width:860px)').matches){
    at.tab='passage';
    var w=$('.work'); if(w) w.dataset.tab='passage';
    document.querySelectorAll('.tabs .btn').forEach(function(b){ b.setAttribute('aria-pressed', String(b.dataset.tab==='passage')); });
  }
  redrawPassage(true);
  var hint=$('#selhint'); if(hint) hint.innerHTML='Clue for question shown in <b style="color:var(--clue)">green-blue</b>. Switch back to keep reading your marks.';
}

function createWithAI(opts){
  var b=busy('Setting your comprehension',['Writing the passage','Setting Booklet A and early Booklet B questions','Setting inferential and open-ended questions','Writing blue-pen notes'],'Each step takes about 20 to 40 seconds.');
  var p;
  call('genPassage',opts).then(function(r){
    p={title:r.title, level:r.level||opts.level, genre:r.genre||opts.genre, paragraphs:r.paragraphs||[], questions:[], aiNotes:[], source:'ai', published:false, settings:{showAiNotes:true, showModel:true}};
    b.step(1); return call('genQuestions',{passage:p, mcq:opts.mcq, part:1});
  }).then(function(qs1){
    p.questions=qs1; b.step(2);
    return call('genQuestions',{passage:p, part:2, existing:qs1});
  }).then(function(qs2){
    p.questions=renumber(p.questions.concat(qs2)); b.step(3);
    return call('annotate',{passage:p}).catch(function(){ return []; });
  }).then(function(notes){
    p.aiNotes=notes||[]; b.done();
    openEditor(p,true);
    toast('Draft ready. Check it, then save and publish.');
  }).catch(function(e){ b.done(); if(p && p.paragraphs.length){ openEditor(p,true); } toast(e.message); });
}

function renumber(qs){
  var a=0,b=0;
  qs.forEach(function(q){ if(q.type==='mcq'){ q.section='A'; q.id='m'+(++a); } else { q.section='B'; q.id='q'+(++b); } });
  return qs;
}

    '<div class="hero"><span class="eyebrow">Upload</span><h1>Bring in your own passage</h1><p class="muted">Paste the passage, questions and your answer key, or attach photos or a PDF of the worksheet. AI sorts it into the booklet format and drafts any missing answers for you to check.</p></div>'+

    '<div class="row"><button class="btn primary" type="submit">Read and organise</button></div></form></div>';
}

function readFile(f){
  return new Promise(function(res,rej){
    var r=new FileReader();
    r.onerror=function(){ rej(new Error('Could not read '+f.name)); };
    if(/\.txt$/i.test(f.name) || f.type==='text/plain'){ r.onload=function(){ res({text:r.result}); }; r.readAsText(f); }
    else { r.onload=function(){ res({mime:f.type, data:String(r.result).split(',')[1]}); }; r.readAsDataURL(f); }
  });
}

function doUpload(){
  var text=$('#uText').value.trim(), files=[].slice.call($('#uFiles').files||[]).slice(0,5), lvl=$('#uLvl').value;
  if(!text && !files.length) return toast('Paste some text or attach a file.');
  var big=files.filter(function(f){ return f.size>12*1024*1024; });
  if(big.length) return toast(big[0].name+' is over 12 MB. Use a smaller file.');
  var b=busy('Reading your material',['Reading the files','Organising passage, questions and answers','Writing blue-pen notes']);
  Promise.all(files.map(readFile)).then(function(parts){
    var extra=parts.filter(function(x){ return x.text; }).map(function(x){ return x.text; }).join('\n\n');
    b.step(1);
    return call('importPassage',{text:[text,extra].filter(Boolean).join('\n\n'), files:parts.filter(function(x){ return x.data; }), level:lvl});
  }).then(function(p){
    b.step(2);
    return call('annotate',{passage:p}).then(function(n){ p.aiNotes=n; return p; }).catch(function(){ return p; });
  }).then(function(p){ b.done(); openEditor(p,true); S.editor.fromUpload=true; render(); toast('Check anything marked “AI-drafted” before publishing.'); })
    .catch(function(e){ b.done(); toast(e.message); });
}

/* --- editor --- */
function openEditor(p, dirty){
  p=deepCopy(p);
  p.questions=p.questions||[]; p.aiNotes=p.aiNotes||[]; p.paragraphs=p.paragraphs||[];
  p.settings=Object.assign({showAiNotes:true, showModel:true}, p.settings||{});
  p.assignments=p.assignments||[];
  S.editor={p:p, dirty:!!dirty, leaving:false};
  S.route={name:'editor'}; render(); window.scrollTo(0,0);
}

function totalOf(p){ return p.questions.reduce(function(s,q){ return s+qMarks(q); },0); }
function qMarks(q){
  if(q.parts && q.parts.length) return q.parts.reduce(function(s,x){ return s+(Number(x.marks)||0); },0);
  if(q.statements && q.statements.length) return q.statements.reduce(function(s,x){ return s+(Number(x.marks)||1); },0);
  return Number(q.marks)||0;
}

function clueStatus(p, quote){
  if(!quote) return '<span class="found no">No clue set</span>';
  var hit=findClue(p.paragraphs, quote);
  return hit ? '<span class="found ok">Found in paragraph '+(hit.p+1)+'</span>' : '<span class="found no">Not found in the passage</span>';
}

    '<div class="row"><button class="btn small ghost" data-act="edMove" data-i="'+i+'" data-d="-1" aria-label="Move up">↑</button><button class="btn small ghost" data-act="edMove" data-i="'+i+'" data-d="1" aria-label="Move down">↓</button><button class="btn small ghost" data-act="edQDel" data-i="'+i+'">Remove</button></div></div>';
  if(S.editor.typeUndo && S.editor.typeUndo.i===i) h+='<div class="flag">Type changed. Check the boxes below. <button class="link" data-act="edTypeUndo" data-i="'+i+'">Undo</button></div>';
  if(q.aiDrafted) h+='<div class="flag">AI-drafted answer. Check it before publishing. <button class="link" data-act="edUnflag" data-i="'+i+'">Mark as checked</button></div>';
  h+='<label class="f">Question<textarea class="grow" rows="2" data-e="'+base+'prompt">'+esc(q.prompt||'')+'</textarea></label>';
  h+='<div class="grid"><label class="f">Skill<select data-e="'+base+'skill">'+SKILLS.map(function(s){ return '<option'+(q.skill===s?' selected':'')+'>'+s+'</option>'; }).join('')+'</select></label>';
  if(!(q.parts||q.statements)) h+='<label class="f">Marks<input type="number" min="0.5" step="0.5" data-e="'+base+'marks" data-num value="'+(q.marks||1)+'"></label>';
  h+='</div>';

  if(q.type==='mcq'){
    h+='<div class="stack" style="gap:6px">'+(q.options||['','','','']).map(function(o,j){
      return '<div class="optrow"><input type="radio" name="ans-'+i+'" data-e="'+base+'answer" data-num value="'+j+'"'+(Number(q.answer)===j?' checked':'')+' aria-label="Correct option '+(j+1)+'" style="width:18px;height:18px;accent-color:var(--good)"><b>('+(j+1)+')</b><textarea class="grow" rows="1" data-e="'+base+'options.'+j+'" aria-label="Option '+(j+1)+'">'+esc(o)+'</textarea>'+
        ((q.options||[]).length>2?'<button class="btn small ghost" data-act="edSubDel" data-i="'+i+'" data-k="options" data-j="'+j+'" aria-label="Remove option '+(j+1)+'">✕</button>':'<span></span>')+'</div>';
    }).join('')+'<div class="row">'+((q.options||[]).length<6?'<button class="btn small" data-act="edSubAdd" data-i="'+i+'" data-k="options">Add option</button>':'')+'<span class="muted small">Tick the correct option.</span></div></div>';

        '<div class="row" style="align-items:flex-end;flex-wrap:nowrap"><label class="f" style="flex:1">Answer key<textarea class="grow" rows="1" data-e="'+pb+'model">'+esc(pt.model||'')+'</textarea></label><label class="f">Marks<input type="number" min="0.5" step="0.5" data-e="'+pb+'marks" data-num value="'+(pt.marks||1)+'"></label></div>'+
        '<label class="f">Clue (exact words from the passage)<textarea class="grow" rows="1" data-e="'+pb+'clue">'+esc(pt.clue||'')+'</textarea></label>'+clueStatus(p,pt.clue)+'</div>';
    }).join('')+'<button class="btn small" data-act="edSubAdd" data-i="'+i+'" data-k="parts" style="align-self:flex-start">Add part</button>';

  return h+'</div>';
}

function setPath(obj, path, val){
  var ks=path.split('.'), o=obj;
  for(var i=0;i<ks.length-1;i++){ var k=ks[i]; if(o[k]==null) o[k]= /^\d+$/.test(ks[i+1]) ? [] : {}; o=o[k]; }
  o[ks[ks.length-1]]=val;
}

function blankQuestion(type, p){
  var q={type:type, prompt:'', skill:'Literal', clue:'', section: type==='mcq'?'A':'B'};
  if(type==='mcq'){ q.options=['','','','']; q.answer=0; q.marks=1; q.skill='Inferential'; }
  else if(type==='sequence'){ q.events=[{text:'',order:1},{text:'',order:2},{text:'',order:3},{text:'',order:4}]; q.marks=1; q.skill='Sequencing'; q.prompt='The events below are not in order. Number them 1 to 4 in the order they happened.'; }
  else if(type==='referent'){ q.parts=[{id:'a',label:'',model:'',marks:1,clue:''},{id:'b',label:'',model:'',marks:1,clue:''}]; q.skill='Referencing'; q.prompt='What do the following words refer to?'; }
  else if(type==='vocab'){ q.parts=[{id:'a',label:'',model:'',marks:1,clue:''},{id:'b',label:'',model:'',marks:1,clue:''}]; q.skill='Vocabulary'; q.prompt='Find words or phrases from the passage that mean the same as the following.'; }
  else if(type==='structured'){ q.parts=[{id:'a',label:'',model:'',marks:1,clue:''},{id:'b',label:'',model:'',marks:1,clue:''}]; }
  else if(type==='truefalse'){ q.statements=[{text:'',answer:'True',reason:'',marks:1,clue:''},{text:'',answer:'False',reason:'',marks:1,clue:''},{text:'',answer:'True',reason:'',marks:1,clue:''}]; q.skill='Evidence'; q.prompt='Based on the passage, state whether each statement is true or false. Then give one reason for your answer.'; }
  else { q.model=''; q.markScheme=''; q.marks=type==='open'?3:2; q.skill= type==='open'?'Evaluative':'Inferential'; }
  return q;
}

function syncParas(){
  if(!S.editor) return;
  var boxes=document.querySelectorAll('textarea[data-para]'); if(!boxes.length) return;
  var out=[]; [].forEach.call(boxes, function(b){ b.value.split(/\n\s*\n/).forEach(function(s){ s=s.replace(/\s*\n\s*/g,' ').trim(); if(s) out.push(s); }); });
  S.editor.p.paragraphs=out;
}
function grow(el){ el.style.height='auto'; el.style.height=(el.scrollHeight+2)+'px'; }
function growAll(){ document.querySelectorAll('textarea.grow').forEach(grow); }
/* change a question's type, keeping what still fits */
function convertQ(old, type){
  var q=blankQuestion(type), deflt=q.prompt;
  q.prompt=old.prompt||deflt; q.clue=old.clue||''; q.skill=old.skill||q.skill; if(old.aiDrafted) q.aiDrafted=true;
  var model=old.model || (old.parts||[]).map(function(pt){ return pt.model; }).filter(Boolean).join('; ');
  if(q.options && old.options) { q.options=old.options.slice(); q.answer=old.answer||0; }
  if(q.parts){ if(old.parts) q.parts=deepCopy(old.parts); else if(model) q.parts[0].model=model; }
  if(q.statements && old.statements) q.statements=deepCopy(old.statements);
  if(q.events && old.events) q.events=deepCopy(old.events);
  if('model' in q){ q.model=model||''; q.markScheme=old.markScheme||''; if(!(old.parts||old.statements)) q.marks=old.marks||q.marks; }
  return q;
}

function saveEditor(){
  syncParas();
  var p=S.editor.p;
  if(!p.paragraphs.length) return toast('Add the passage text first.');
  p.questions.forEach(function(q){ var seen={}; (q.parts||[]).forEach(function(pt,j){ var v=String(pt.id==null?'':pt.id).replace(/[()\s]/g,'').slice(0,6);
    if(!v || seen[v.toLowerCase()]) v=String.fromCharCode(97+j); seen[v.toLowerCase()]=1; pt.id=v; }); });
  p.questions=renumber(p.questions);
  var b=busy('Saving',['Saving passage'],' ');
  call('savePassage',{passage:p}).then(function(saved){
    b.done(); S.editor.p=saved; S.editor.dirty=false; render(); toast(saved.published?'Saved and published.':'Saved as draft.');
    refreshDash();
  }).catch(function(e){ b.done(); toast(e.message); });
}

  else if(k==='settings'){
    var b=busy('Saving',['Saving marking rules'],' ');
    call('saveSettings',{markingNotes:$('#setNotes').value}).then(function(s){ b.done(); S.dash.settings=s; toast('Marking rules saved.'); }).catch(function(er){ b.done(); toast(er.message); });
  }
});

document.addEventListener('input', onField);
document.addEventListener('change', onField);
function onField(e){
  var el=e.target;
  if(el.classList && el.classList.contains('grow') && e.type==='input') grow(el);
  if(el.id==='sCls' && e.type==='change'){ S.pickCls=el.value; render(); var nm=$('#sName'); if(nm && !nm.disabled) nm.focus(); return; }
  if(el.id==='fltCls'){ return; }
  if(el.dataset.asg!=null && S.editor){
    var A=S.editor.p.assignments, idx=Number(el.dataset.asg), f=el.dataset.f;
    if(f==='cls') A[idx].cls=el.value;
    if(f==='due') A[idx].due=el.value ? new Date(el.value).getTime() : null;
    if(f==='lock') A[idx].lock=el.checked;
    markDirty();
    if(e.type==='change'){ syncParas(); render(); }
    return;
  }
  if(el.id==='showAi'){ var at=S.route.name==='review'?S.review:S.attempt; at.showAi=el.checked; at.sheet=null; redrawPassage(false); drawSheet(); return; }
  if(el.dataset.bind && S.attempt && !S.attempt.result){
    var parts=el.dataset.bind.split('|'), qid=parts[0], k=parts[1], f=parts[2], A=S.attempt.answers;
    var q=S.attempt.passage.questions.filter(function(x){ return x.id===qid; })[0];
    if(q && q.type==='mcq'){ A[qid]=Number(el.value); el.closest('.opts').querySelectorAll('.opt').forEach(function(o){ o.classList.toggle('sel', o.contains(el)); }); }
    else if(k==null) A[qid]=el.value;
    else { A[qid]=A[qid]&&typeof A[qid]==='object'?A[qid]:{}; if(f){ A[qid][k]=A[qid][k]||{}; A[qid][k][f]=el.value; } else A[qid][k]=el.value; }
    if(S.attempt.confirming){ S.attempt.confirming=false; var sb=document.querySelector('[data-act=submit]'); if(sb) sb.textContent='Hand in for marking'; var sn=$('#submitNote'); if(sn) sn.textContent=''; }
    saveDraft(); updateProg(); return;
  }
  if(el.dataset.e && S.editor){
    var v = el.dataset.bool!==undefined ? el.checked : el.dataset.num!==undefined ? Number(el.value) : el.value;
    if(el.type==='radio' && !el.checked) return;
    setPath(S.editor.p, el.dataset.e, v);
    markDirty(); return;
  }
  if(el.id==='edParas'){ markDirty(); if(e.type==='change'){ syncParas(); render(); } }
  if(el.dataset.para!=null && S.editor){ markDirty(); if(e.type==='change' && (/\n\s*\n/.test(el.value) || !el.value.trim())){ syncParas(); render(); } }
  if(el.dataset.qtype!=null && S.editor && e.type==='change'){
    syncParas(); var qi=Number(el.dataset.qtype), oq=S.editor.p.questions[qi];
    S.editor.p.questions[qi]=convertQ(oq, el.value); S.editor.p.questions=renumber(S.editor.p.questions);
    S.editor.typeUndo={i:qi, q:oq}; markDirty(); render(); }
}
function markDirty(){ if(!S.editor.dirty){ S.editor.dirty=true; var pill=document.querySelector('.pill.good'); if(pill && S.route.name==='editor'){ pill.className='pill part'; pill.textContent='Unsaved changes'; } } }

document.addEventListener('pointerdown', function(e){ if(e.target.closest('.annobar .sw')) e.preventDefault(); });

document.addEventListener('click', function(e){
  // a tap on a word in the passage: its meaning
  if(e.target.closest && e.target.closest('#passage p[data-p]') && !e.target.closest('[data-act]')){
    var atw=curAt();
    if(atw){
      var sl=getSelection();
      if(!(sl && !sl.isCollapsed && S.route.name==='attempt')){
        var w=wordAt(e, atw);
        if(w){
          var mkw=e.target.closest('.mk'), idsw=mkw?mkw.dataset.mk.split(' '):[];
          var uw=idsw.filter(function(x){ return x.indexOf('u:')===0; }).pop(), aw=idsw.filter(function(x){ return x.indexOf('a:')===0; }).pop();
          openWord(atw, w, {u:uw?uw.slice(2):null, a:aw?Number(aw.slice(2)):null}); return;
        }
      }
    }
  }
  // passage marks
  var mk=e.target.closest('.mk');
  if(mk && !e.target.closest('[data-act]')){
    var at=S.route.name==='review'?S.review:S.attempt;
    if(at){
      var sel=getSelection(); if(sel && !sel.isCollapsed && S.route.name==='attempt') return;
      var ids=mk.dataset.mk.split(' ');
      var u=ids.filter(function(x){ return x.indexOf('u:')===0; }).pop(), a=ids.filter(function(x){ return x.indexOf('a:')===0; }).pop();
      if(u) at.sheet={kind:'anno', id:u.slice(2)}; else if(a) at.sheet={kind:'ai', idx:Number(a.slice(2))}; else return;
      drawSheet(); return;
    }
  }
  var t=e.target.closest('[data-act]'); if(!t) return;
  var act=t.dataset.act, id=t.dataset.id;
  var AT=S.attempt;
  switch(act){
    case 'start': startAttempt(id); break;
    case 'wClose': var atc=curAt(); if(atc){ atc.sheet=null; atc.wordMark=null; redrawPassage(false); drawSheet(); } break;
    case 'wSay': var ats=curAt(); if(ats && ats.sheet && ats.sheet.w) sayWord(ats.sheet.w.word); break;
    case 'wRetry': var atr=curAt(); if(atr && atr.sheet && atr.sheet.w) lookUp(atr, atr.sheet.w); break;
    case 'wMark': var atm=curAt(); if(atm && atm.sheet && atm.sheet.u){ atm.sheet={kind:'anno', id:atm.sheet.u}; atm.wordMark=null; redrawPassage(false); drawSheet(); } break;
    case 'wOpen': var ato=curAt(), it=ato && (ato.words||[])[Number(t.dataset.i)];
      if(it){ ato.defs=ato.defs||{}; ato.defs[wKey(it.w)]=it.d;
        if(ato.tab!=='passage' && matchMedia('(max-width:860px)').matches){ ato.tab='passage'; var wk=$('.work'); if(wk) wk.dataset.tab='passage'; document.querySelectorAll('.tabs .btn').forEach(function(b){ b.setAttribute('aria-pressed', String(b.dataset.tab==='passage')); }); }
        openWord(ato, it.w); var mkq=$('.mk.wq'); if(mkq) mkq.scrollIntoView({block:'center'}); }
      break;
    case 'wSel':
      var atl=S.attempt, sw=takeSel(); if(!atl || !sw) break;
      var tx=atl.passage.paragraphs[sw.p].slice(sw.start,sw.end);
      if(tx.length>60 || tx.split(/\s+/).length>6){ toast('Choose one word, or up to 6 words.'); break; }
      clearSel(); openWord(atl, {p:sw.p,start:sw.start,end:sw.end,word:tx}); break;
    case 'toTeacher':
      break;
      window.scrollTo(0,0); break;
    case 'toStudent':
      S.view='student'; S.loadErr=''; S.route={name:'home'}; render(); loadStudent(); window.scrollTo(0,0); break;
    case 'reloadDash': refreshDash().then(function(){ if(S.dash) toast('Reloaded.'); }); break;
    case 'changeMe': S.picking=true; S.pickCls=S.student.cls; render(); break;
    case 'asgAdd':
      syncParas(); S.editor.p.assignments.push({cls:$('#asgNew').value, due:defaultDue(), lock:true}); markDirty(); render(); break;
    case 'asgAll':
      syncParas();
      [].slice.call($('#asgNew').options).forEach(function(o){ S.editor.p.assignments.push({cls:o.value, due:defaultDue(), lock:true}); });
      markDirty(); render(); break;
    case 'asgDel': syncParas(); S.editor.p.assignments.splice(Number(t.dataset.i),1); markDirty(); render(); break;
    case 'flt': S.subs.cls=t.dataset.cls||''; render(); break;
    case 'openResult': openResult(id); break;
    case 'back':
      if(S.view==='teacher'){ S.attempt=null; S.route={name:'editor'}; render(); }
      else { S.attempt=null; S.route={name:'home'}; render(); loadStudent(); }
      window.scrollTo(0,0); break;
    case 'tab':
      var obj=S.route.name==='review'?S.review:AT; obj.tab=t.dataset.tab;
      var w=$('.work'); if(w) w.dataset.tab=obj.tab;
      document.querySelectorAll('.tabs .btn').forEach(function(b){ b.setAttribute('aria-pressed', String(b.dataset.tab===obj.tab)); });
      window.scrollTo(0, Math.min(window.scrollY, (w?w.offsetTop-120:0))); break;
    case 'hl':
      var s=takeSel(); if(!s) break;
      AT.annos.push({id:Math.random().toString(36).slice(2,8), p:s.p, start:s.start, end:s.end, style:t.dataset.style, note:''});
      clearSel(); AT.sheet=null; redrawPassage(false); drawSheet(); saveDraft(); break;
    case 'noteNew':
      var s2=takeSel(); if(!s2) break;
      AT.sheet={kind:'new', sel:s2}; drawSheet(); break;
    case 'noteCreate':
      var sh=AT.sheet; var txt=$('#noteText').value.trim();
      AT.annos.push({id:Math.random().toString(36).slice(2,8), p:sh.sel.p, start:sh.sel.start, end:sh.sel.end, style:'n', note:txt});
      clearSel(); AT.sheet=null; redrawPassage(false); drawSheet(); saveDraft(); break;
    case 'noteSave':
      AT.annos.forEach(function(x){ if(x.id===id) x.note=$('#noteText').value.trim(); });
      AT.sheet=null; redrawPassage(false); drawSheet(); saveDraft(); toast('Note saved.'); break;
    case 'annoDel':
      AT.annos=AT.annos.filter(function(x){ return x.id!==id; }); AT.sheet=null; redrawPassage(false); drawSheet(); saveDraft(); break;
    case 'sheetClose':
      (S.route.name==='review'?S.review:AT).sheet=null; drawSheet(); break;
    case 'submit': submitAttempt(); break;
    case 'clue': showClue(t.dataset.q, t.dataset.part); break;

    // teacher
    case 'logout': break;
    case 'go': S.route={name:t.dataset.r}; render(); window.scrollTo(0,0); break;
    case 'copy':
      var text=t.dataset.text;
      var done=function(){ toast('Link copied.'); };
      if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done).catch(function(){ fallbackCopy(text); });
      else fallbackCopy(text);
      break;
    case 'newBlank': openEditor({title:'', level:'P6', genre:'Narrative', paragraphs:[], questions:[], aiNotes:[], published:false},true); break;
    case 'edit':
      var p0=(S.dash.passages||[]).filter(function(x){ return x.id===id; })[0]; if(p0){ var c=deepCopy(p0); delete c.stats; openEditor(c,false); } break;
    case 'edBack':
      if(S.editor.dirty && !S.editor.leaving){ S.editor.leaving=true; render(); break; }
      S.editor=null; S.route={name:'home'}; render(); refreshDash(); break;
    case 'edSave': saveEditor(); break;
    case 'edPreview':
      syncParas(); var pv=deepCopy(S.editor.p); pv.questions=renumber(pv.questions);
      var san=deepCopy(pv); san.questions.forEach(function(q){ delete q.answer; delete q.model; (q.events||[]).forEach(function(ev){ delete ev.order; }); });
      if(!pv.settings.showAiNotes) san.aiNotes=[];
      startAttempt(null, san); break;
    case 'edAnnotate':
      syncParas();
      var b1=busy('Writing blue-pen notes',['Reading the passage and questions']);
      call('annotate',{passage:S.editor.p}).then(function(n){ b1.done(); S.editor.p.aiNotes=n; markDirty(); render(); }).catch(function(er){ b1.done(); toast(er.message); });
      break;
    case 'edNoteDel': syncParas(); S.editor.p.aiNotes.splice(Number(t.dataset.i),1); markDirty(); render(); break;
    case 'edAdd':
      syncParas(); var ty=$('#addType').value; S.editor.p.questions.push(blankQuestion(ty)); S.editor.p.questions=renumber(S.editor.p.questions); markDirty(); render(); break;
    case 'edQDel': syncParas(); S.editor.p.questions.splice(Number(t.dataset.i),1); S.editor.p.questions=renumber(S.editor.p.questions); markDirty(); render(); break;
    case 'edMove':
      syncParas(); var i=Number(t.dataset.i), d=Number(t.dataset.d), qs=S.editor.p.questions;
      if(qs[i+d]){ var tmp=qs[i]; qs[i]=qs[i+d]; qs[i+d]=tmp; S.editor.p.questions=renumber(qs); markDirty(); render(); }
      break;
    case 'edParaAdd': syncParas(); S.editor.p.paragraphs.splice(Number(t.dataset.i)+1,0,''); markDirty(); render();
      var nb=document.querySelector('textarea[data-para="'+(Number(t.dataset.i)+1)+'"]'); if(nb) nb.focus(); break;
    case 'edParaJoin': syncParas(); var pj=Number(t.dataset.i), PP=S.editor.p.paragraphs; if(pj>0 && PP[pj]!=null){ PP[pj-1]=(PP[pj-1]+' '+PP[pj]).trim(); PP.splice(pj,1); markDirty(); render(); } break;
    case 'edParaDel': syncParas(); S.editor.p.paragraphs.splice(Number(t.dataset.i),1); markDirty(); render(); break;
    case 'edTypeUndo': var tu=S.editor.typeUndo; if(tu){ S.editor.p.questions[tu.i]=tu.q; S.editor.p.questions=renumber(S.editor.p.questions); S.editor.typeUndo=null; markDirty(); render(); } break;
    case 'edUnflag': S.editor.p.questions[Number(t.dataset.i)].aiDrafted=false; markDirty(); render(); break;
    case 'edSubAdd':
      syncParas(); var q=S.editor.p.questions[Number(t.dataset.i)], key=t.dataset.k;
      if(key==='events') q.events.push({text:'',order:q.events.length+1});
      if(key==='options'){ q.options=q.options||[]; q.options.push(''); }
      if(key==='parts') q.parts.push({id:String.fromCharCode(97+q.parts.length),label:'',model:'',marks:1,clue:''});
      if(key==='statements') q.statements.push({text:'',answer:'True',reason:'',marks:1,clue:''});
      markDirty(); render(); break;
    case 'edSubDel':
      syncParas(); var q2=S.editor.p.questions[Number(t.dataset.i)]; q2[t.dataset.k].splice(Number(t.dataset.j),1);
      if(t.dataset.k==='parts') q2.parts.forEach(function(pt,j){ pt.id=String.fromCharCode(97+j); });
      if(t.dataset.k==='options'){ var dj=Number(t.dataset.j), an=Number(q2.answer)||0; q2.answer = an===dj ? 0 : an>dj ? an-1 : an; }
      markDirty(); render(); break;
    case 'edDelete':
      if(!S.editor.delConfirm){ S.editor.delConfirm=true; render(); break; }
      call('deletePassage',{id:S.editor.p.id}).then(function(){ S.editor=null; S.route={name:'home'}; toast('Passage deleted.'); refreshDash().then(render); }).catch(function(er){ toast(er.message); });
      break;
    case 'results': openResults(id); break;
    case 'review': openReview(id); break;
    case 'analyse':
      var b2=busy('Analysing the class',['Reading every pupil\'s answers','Looking for patterns and misconceptions']);
      setTimeout(function(){ b2.step(1); }, 6000);
      var fc=t.dataset.cls||'';
      call('analyse',{id:id, cls:fc}).then(function(an){ b2.done(); var p1=curPassage(); if(p1){ p1.analyses=p1.analyses||{}; p1.analyses[fc?normCls(fc):'all']=an; } render(); }).catch(function(er){ b2.done(); toast(er.message); });
      break;
    case 'saveReview':
      var aw={}; document.querySelectorAll('[data-ovr]').forEach(function(inp){ aw[inp.dataset.ovr]=Number(inp.value); });
      var b3=busy('Saving',['Saving marks'],' ');
      call('saveReview',{id:S.review.sub.id, awarded:aw, comment:$('#tComment').value}).then(function(s3){
        b3.done(); S.review.sub=s3; S.subs.list=S.subs.list.map(function(x){ return x.id===s3.id?s3:x; }); render(); toast('Marks saved. The pupil will see them.');
      }).catch(function(er){ b3.done(); toast(er.message); });
      break;
    case 'remark':
      var b4=busy('Re-marking with AI',['Checking each answer against the answer key']);
      call('remark',{id:S.review.sub.id}).then(function(s4){ b4.done(); S.review.sub=s4; S.subs.list=S.subs.list.map(function(x){ return x.id===s4.id?s4:x; }); render(); }).catch(function(er){ b4.done(); toast(er.message); });
      break;
    case 'subDel':
      if(!S.review.delConfirm){ S.review.delConfirm=true; render(); break; }
      call('deleteSub',{id:S.review.sub.id}).then(function(){ toast('Submission deleted.'); openResults(S.review.passage.id); }).catch(function(er){ toast(er.message); });
      break;
  }
});
document.addEventListener('keydown', function(e){ if(e.key==='Enter'){ var tr=e.target.closest && e.target.closest('tr[data-act]'); if(tr) tr.click(); } });

function fallbackCopy(text){
  var ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select();
  var ok=false; try{ ok=document.execCommand('copy'); }catch(e){} ta.remove();
  toast(ok?'Link copied.':'Copy this link: '+text);
}

/* ---------- boot ---------- */
if(BOOT.embed) document.body.classList.add('embed');
if(S.view==='teacher'){
  render(); refreshDash();
} else {
  render(); loadStudent();
}
})();
