<!DOCTYPE html>
<html lang="en-SG">
<!-- Comprehension: the teacher page (?page=comp) and the pupil screens the Class Hub shows in English → Comprehension. Built from the Comprehension Marker. -->
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap">
<style>
/* Layout: sticky app bar; reading view splits into passage (left, sticky) and booklet questions (right); stacks into tabs on phones. */
:root{
  --paper:#F4F1FD; --surface:#ffffff; --sunk:#EFEBFA; --ink:#1E1735; --muted:#5C5578; --line:#DDD6F3; --line-soft:#ECE7F8;
  --pen:#4B2FC4; --pen-soft:#ECE9FB; --on-pen:#ffffff;
  --clue:#0d7a6e; --clue-bg:#c6eee5;
  --hl-y:#fde98a; --hl-g:#c3eeb5; --hl-p:#f8c8e5; --ul:#7445c2;
  --good:#1d7743; --good-bg:#dcf2e4; --part:#965f00; --part-bg:#fbeed3; --zero:#536079; --zero-bg:#e7ecf3;
  --f-display:"Bricolage Grotesque","Atkinson Hyperlegible",system-ui,sans-serif;
  --f-ui:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-read:"Literata",Georgia,"Times New Roman",serif;
  --hdr:58px; --r:10px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:16px/1.5 var(--f-ui);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(1.5rem,3.4vw,2.1rem);font-weight:800;letter-spacing:-.01em}
h2{font-size:1.3rem;font-weight:800}
h3{font-size:1.05rem;font-weight:600}
p{margin:0}
:focus-visible{outline:3px solid var(--pen);outline-offset:2px;border-radius:4px}
[hidden]{display:none!important}

/* App bar */
.bar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);height:var(--hdr);
  display:flex;align-items:center;gap:12px;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:1.05rem;white-space:nowrap}
.brand .nib{width:28px;height:28px;border-radius:7px;background:var(--pen);display:grid;place-items:center;color:var(--on-pen);font-size:.8rem;font-family:var(--f-ui);font-weight:700}
.bar .sp{flex:1}
.who{font-size:.85rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}

main{max-width:1280px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:24px 64px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);
  background:var(--surface);cursor:pointer;font-weight:700;font-size:.92rem;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--pen);border-color:var(--pen);color:var(--on-pen)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.small{min-height:32px;padding:0 10px;font-size:.84rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.warn{color:var(--part)}
.link{background:none;border:0;padding:0;color:var(--pen);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* Fields */
label.f{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:.9rem;min-width:0}
input[type=text],input[type=number],input[type=password],select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:9px 11px;min-height:42px}
textarea{resize:vertical;line-height:1.5}
input[type=number]{width:84px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg label{display:flex}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{padding:7px 14px;cursor:pointer;font-weight:700;font-size:.9rem}
.seg input:checked+span{background:var(--pen);color:var(--on-pen)}
.seg input:focus-visible+span{outline:3px solid var(--pen);outline-offset:-3px}

/* Panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.pen{background:var(--pen-soft);color:var(--pen)}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.part{background:var(--part-bg);color:var(--part)}
.pill.zero{background:var(--zero-bg);color:var(--zero)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipbtn{min-height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:.86rem;cursor:pointer}
.chipbtn[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.asg{display:grid;grid-template-columns:minmax(110px,1fr) minmax(190px,1.4fr) auto auto;gap:8px;align-items:center}
.asg input[type=datetime-local]{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:8px 10px;min-height:42px}
@media (max-width:620px){.asg{grid-template-columns:minmax(0,1fr) auto auto}.asg input[type=datetime-local]{grid-column:1 / -1;grid-row:2}}
.missing{display:flex;flex-wrap:wrap;gap:6px}
.missing span{background:var(--sunk);border-radius:6px;padding:4px 9px;font-size:.88rem}
.banner{border-radius:12px;padding:12px 14px;background:var(--part-bg);color:var(--part);font-weight:700}
.banner.calm{background:var(--sunk);color:var(--muted)}

/* Lists */
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 16px;border-top:1px solid var(--line-soft)}
.item:first-child{border-top:0}
.item h3{margin-bottom:3px}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.85rem;color:var(--muted);align-items:center}
.score{font-family:var(--f-display);font-weight:800;font-size:1.25rem;font-variant-numeric:tabular-nums}
@media (max-width:620px){.item{grid-template-columns:minmax(0,1fr)}}

.empty{padding:28px 18px;text-align:center;color:var(--muted)}
.foot{margin-top:40px;padding-top:16px;border-top:1px solid var(--line-soft);display:flex;justify-content:center;font-size:.88rem}
.foot .link{color:var(--muted)}

/* Reading workspace */
.work{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);gap:24px;align-items:start}
.pane-passage{position:sticky;top:calc(var(--hdr) + 12px);max-height:calc(100dvh - var(--hdr) - 24px);overflow:auto;
  background:var(--surface);border:1px solid var(--line);border-radius:14px}
.tabs{display:none}
@media (max-width:860px){
  .work{grid-template-columns:minmax(0,1fr);gap:0}
  .pane-passage{position:static;max-height:none;overflow:visible}
  .tabs{display:flex;position:sticky;top:var(--hdr);z-index:15;background:var(--paper);padding-block:10px;gap:8px}
  .tabs .btn{flex:1}
  .tabs .btn[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .work[data-tab=passage] .pane-q{display:none}
  .work[data-tab=questions] .pane-passage{display:none}
}

.annobar{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line-soft);padding:10px 14px;display:flex;flex-direction:column;gap:8px}
.annobar .tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sw{min-height:34px;padding:0 11px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;font-size:.82rem;display:inline-flex;align-items:center;gap:6px}
.sw i{width:14px;height:14px;border-radius:3px;display:inline-block}
.sw-y i{background:var(--hl-y)} .sw-g i{background:var(--hl-g)} .sw-p i{background:var(--hl-p)}
.sw-u i{background:none;border-bottom:3px solid var(--ul);border-radius:0;height:10px}
.sw-n i{background:none;border:2px solid var(--ul);border-radius:50%}
.selhint{font-size:.8rem;color:var(--muted);min-height:1.2em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.selhint b{color:var(--ink)}
.tgl{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;font-weight:700;color:var(--pen);margin-left:auto;cursor:pointer}
.tgl input{accent-color:var(--pen);width:16px;height:16px}

.passage{padding:18px 20px 28px;font-family:var(--f-read);font-size:1.06rem;line-height:1.8}
.passage .p-head{margin-bottom:14px;font-family:var(--f-ui)}
.passage .p-head h2{font-size:1.45rem;margin-top:4px}
.para{display:grid;grid-template-columns:28px minmax(0,1fr);gap:6px;margin-bottom:14px}
.pn{font-family:var(--f-ui);font-size:.75rem;color:var(--muted);font-weight:700;padding-top:.45em;text-align:right;font-variant-numeric:tabular-nums}
.para p{-webkit-user-select:text;user-select:text}

.mk{border-radius:3px;cursor:pointer}
.mk.hl-y{background:var(--hl-y)} .mk.hl-g{background:var(--hl-g)} .mk.hl-p{background:var(--hl-p)}
.mk.hl-u,.mk.hl-n{text-decoration:underline;text-decoration-color:var(--ul);text-decoration-thickness:2px;text-underline-offset:4px}
.mk.ai{text-decoration:underline wavy;text-decoration-color:var(--pen);text-decoration-thickness:1.5px;text-underline-offset:5px;color:var(--pen)}
.mk.clue{background:var(--clue-bg);box-shadow:0 0 0 2px var(--clue-bg);color:var(--ink)}
.mk.clue.flash{animation:flash 1.4s ease-out 2}
@keyframes flash{50%{box-shadow:0 0 0 6px var(--clue-bg)}}
@media (prefers-reduced-motion:reduce){.mk.clue.flash{animation:none}}
.mk.ne-ai::after,.mk.ne-u::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;margin-left:2px;vertical-align:super}
.mk.ne-ai::after{background:var(--pen)}
.mk.ne-u::after{background:var(--ul)}

.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-family:var(--f-ui);font-size:.78rem;color:var(--muted);padding:0 20px 16px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:18px;height:10px;border-radius:2px}

.sheet{position:sticky;bottom:0;z-index:6;margin:0 12px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;
  box-shadow:0 10px 30px rgba(10,20,40,.18);display:flex;flex-direction:column;gap:8px;font-family:var(--f-ui)}
.sheet .q{font-family:var(--f-read);font-style:italic;color:var(--muted);font-size:.92rem}
.sheet .note{color:var(--pen);font-weight:700}
.sheet.u .note{color:var(--ul)}
@media (max-width:860px){
  .sheet{position:fixed;left:0;right:0;bottom:0;margin:0;border-radius:16px 16px 0 0;z-index:30;
    padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
}

/* Booklet questions */
.booklet{display:flex;flex-direction:column;gap:14px}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:6px 2px 0;border-bottom:2px solid var(--ink)}
.sec h2{font-size:1.1rem}
.qc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.qh{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start}
.qn{font-family:var(--f-display);font-weight:800;font-size:1rem;min-width:30px}
.qp{font-weight:700}
.qm{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:700;white-space:nowrap}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:10px;align-items:start;padding:9px 11px;border:1px solid var(--line-soft);border-radius:9px;cursor:pointer}
.opt input{margin-top:4px;accent-color:var(--pen);width:18px;height:18px}
.opt b{font-variant-numeric:tabular-nums}
.opt.sel{border-color:var(--pen);background:var(--pen-soft)}
.opt.key{border-color:var(--good);background:var(--good-bg)}
textarea.lined{border:0;border-radius:0;background:transparent;padding:0 2px;min-height:auto;
  background-image:linear-gradient(to bottom,transparent calc(2em - 1px),var(--line) calc(2em - 1px));background-size:100% 2em;line-height:2em;
  background-attachment:local}
textarea.lined:focus{outline:none;background-color:var(--pen-soft)}
.parts{display:flex;flex-direction:column;gap:10px}
.part{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px}
.part .pl{font-weight:700;color:var(--muted)}
.tbl{width:100%;border-collapse:collapse;font-size:.95rem}
.tblwrap{overflow-x:auto}
.tbl th,.tbl td{border:1px solid var(--line);padding:8px;vertical-align:top;text-align:left}
.tbl th{background:var(--sunk);font-size:.82rem}
.tfseg{display:flex;gap:6px;flex-wrap:wrap}
.tfseg label{display:flex}
.tfseg input{position:absolute;opacity:0}
.tfseg span{padding:5px 12px;border:1px solid var(--line);border-radius:999px;font-weight:700;font-size:.85rem;cursor:pointer}
.tfseg input:checked+span{background:var(--pen);border-color:var(--pen);color:var(--on-pen)}
.tfseg input:focus-visible+span{outline:3px solid var(--pen)}
select.ord{width:72px}

.ans{background:var(--sunk);border-radius:8px;padding:9px 11px;white-space:pre-wrap;font-family:var(--f-read)}
.ans.blank{color:var(--muted);font-style:italic;font-family:var(--f-ui)}
.ans s.gw{color:#B4232F;text-decoration-thickness:2px}
.ans ins.gf{text-decoration:none;color:#B4232F;font-family:var(--f-ui);font-weight:700;font-size:.9em;background:#FDECEE;border-radius:4px;padding:0 4px;margin-left:3px}
.gram{background:#FFF8E6;border-radius:8px;padding:8px 11px;font-size:.9rem}
.gram-h{font-weight:800;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.gram-h span{font-size:.75rem;font-weight:700;background:var(--good-bg);color:var(--good);border-radius:999px;padding:1px 8px}
.gram ul{margin:4px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.gram s{color:var(--muted)}
.gram .gr{display:block;color:var(--muted);font-size:.85rem}
.res{display:flex;flex-direction:column;gap:8px;border-top:1px dashed var(--line);padding-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-variant-numeric:tabular-nums;padding:3px 10px;border-radius:999px;font-size:.88rem}
.v-full{background:var(--good-bg);color:var(--good)} .v-part{background:var(--part-bg);color:var(--part)} .v-zero{background:var(--zero-bg);color:var(--zero)}
.fb{color:var(--pen)}
.key{font-size:.92rem;background:var(--good-bg);border-radius:8px;padding:8px 11px;white-space:pre-wrap}
.key b{color:var(--good)}
.teach{border-top:1px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.teach.sub{border-top:0;padding-top:4px;gap:8px}
.teach.total{margin-top:4px}
.teach-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.teach-h b{font-family:var(--f-display);font-weight:600;font-size:1rem}
.teach.sub .teach-h b{font-size:.92rem}
.find{background:color-mix(in srgb,var(--clue-bg) 45%,var(--surface));border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.find-h{font-size:.74rem;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--clue)}
.quote{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--surface);color:var(--ink);border:0;border-left:3px solid var(--clue);border-radius:4px;padding:8px 11px;
  font-family:var(--f-read);font-style:italic;font-size:.98rem;line-height:1.55;cursor:pointer;width:100%}
.quote span{font-family:var(--f-ui);font-style:normal;font-size:.78rem;font-weight:700;color:var(--clue)}
.quote:hover{background:var(--sunk)}
.think{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:5px}
.think li::marker{color:var(--clue);font-weight:700}
.tip{font-size:.92rem;background:var(--pen-soft);border-radius:8px;padding:8px 11px}
.tip b{color:var(--pen)}
.clue-btn{display:inline-flex;align-items:center;gap:6px;background:var(--clue-bg);color:var(--clue);border:0;border-radius:999px;padding:5px 12px;font-weight:700;font-size:.84rem;cursor:pointer}
.clue-btn:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--clue)}

/* Results header */
.scorecard{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.big{font-family:var(--f-display);font-weight:800;font-size:2.6rem;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:1.1rem;color:var(--muted)}

/* Teacher stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat .v{font-family:var(--f-display);font-weight:800;font-size:1.6rem;font-variant-numeric:tabular-nums}
.stat .l{font-size:.8rem;color:var(--muted);font-weight:700}
.bars{display:flex;flex-direction:column;gap:8px}
.br{display:grid;grid-template-columns:minmax(90px,170px) minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:.88rem}
.br .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.br .track{height:14px;background:var(--sunk);border-radius:4px;position:relative;overflow:hidden;
  background-image:repeating-linear-gradient(to right,transparent 0 calc(25% - 1px),var(--line) calc(25% - 1px) 25%)}
.br .fill{height:100%;border-radius:4px;background:var(--pen)}
.br .fill.lo{background:var(--part)}
.br .val{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.axis{display:grid;grid-template-columns:minmax(90px,170px) minmax(0,1fr) 64px;gap:10px;font-size:.72rem;color:var(--muted)}
.axis div:nth-child(2){display:flex;justify-content:space-between}
@media (max-width:620px){
  .br,.axis{grid-template-columns:6.5rem minmax(0,1fr) 2.8rem;gap:8px}
  .who{display:none}
}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}
.table{width:100%;border-collapse:collapse;font-size:.92rem}
.table th,.table td{padding:10px 12px;border-top:1px solid var(--line-soft);text-align:left;white-space:nowrap}
.table th{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;border-top:0}
.table tr.click{cursor:pointer}
.table tr.click:hover td{background:var(--sunk)}
.num{text-align:right!important;font-variant-numeric:tabular-nums}
.ai-box{border-left:4px solid var(--pen);background:var(--pen-soft);border-radius:0 12px 12px 0;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.ai-box h3{color:var(--pen)}
.ai-box ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}

/* Editor */
.qe{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.qe .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.sub{border:1px dashed var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px}
.found{font-size:.78rem;font-weight:700}
.found.ok{color:var(--good)} .found.no{color:var(--part)}
.flag{background:var(--part-bg);color:var(--part);border-radius:8px;padding:6px 10px;font-size:.85rem;font-weight:700}

/* Overlays */
#busy{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,var(--paper) 82%,transparent);display:grid;place-items:center;padding:16px}
.busy-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;width:min(440px,100%);display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px rgba(10,20,40,.2)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.steps li{display:flex;gap:10px;align-items:center;color:var(--muted)}
.steps li:before{content:"";width:12px;height:12px;border-radius:50%;border:2px solid var(--line);flex:none}
.steps li.on{color:var(--ink);font-weight:700}
.steps li.on:before{border-color:var(--pen);border-top-color:transparent;animation:spin 1s linear infinite}
.steps li.done:before{background:var(--good);border-color:var(--good)}
@keyframes spin{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--paper);
  padding:10px 16px;border-radius:999px;font-weight:700;font-size:.9rem;max-width:calc(100% - 32px)}
.hero{display:flex;flex-direction:column;gap:6px;margin-bottom:6px}
.err{background:var(--part-bg);color:var(--part);border-radius:10px;padding:10px 14px;font-weight:700}
/* Inside the Class Hub: the Hub has its own top bar */
body.embed{--hdr:0px;background:transparent}
body.embed .bar{display:none}
body.embed main{padding-block:10px 40px}
.ai-warn{background:var(--part-bg);color:var(--part);border-radius:12px;padding:12px 14px;font-weight:700}

/* ===== Pupil look (27 Oct): friendly, colourful, still calm for reading ===== */
:root{--sun:#FFB020;--sun-soft:#FFF3D6;--mint:#14A37F;--mint-soft:#DDF6EE;--rose:#E0457B;--rose-soft:#FDE4EE;--sky:#2F7BE5;--sky-soft:#E1EDFD;
  --sh:0 1px 2px rgba(40,20,110,.06),0 6px 20px rgba(40,20,110,.08);--sh-lg:0 2px 4px rgba(40,20,110,.08),0 14px 34px rgba(40,20,110,.14)}
.kid{display:flex;flex-direction:column;gap:18px}
.khero{position:relative;overflow:hidden;border-radius:22px;padding:22px 22px 20px;color:#fff;
  background:radial-gradient(120% 140% at 100% 0%,#8B5CF6 0%,rgba(139,92,246,0) 55%),linear-gradient(135deg,#4B2FC4 0%,#6D3FE0 55%,#B44AD8 100%);box-shadow:var(--sh-lg);
  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center}
.khero .khi{font-weight:700;opacity:.92;font-size:.95rem}
.khero h1{color:#fff;font-size:clamp(1.6rem,5vw,2.2rem);margin:2px 0 6px}
.khero p{opacity:.92;max-width:46ch}
.ksteps{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;align-items:center}
.ksteps span{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:4px 11px;font-weight:700;font-size:.86rem;white-space:nowrap}
.ksteps i{font-style:normal;opacity:.7}
.khero-art{width:120px;height:104px}
.khero::after{content:"";position:absolute;right:-40px;bottom:-60px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.07)}
@media (max-width:520px){.khero p{font-size:.94rem}.ksteps i{display:none}.khero{grid-template-columns:minmax(0,1fr);padding:18px}.khero-art{position:absolute;right:10px;top:10px;width:78px;height:68px;opacity:.9}.khero h1{padding-right:70px}}
.kstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kstats div{background:var(--surface);border-radius:16px;padding:12px 12px 10px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:2px;border-top:4px solid var(--c)}
.kstats b{font-family:var(--f-display);font-weight:800;font-size:1.55rem;line-height:1.1;font-variant-numeric:tabular-nums}
.kstats span{font-size:.8rem;font-weight:700;color:var(--muted)}
.ksec{display:flex;align-items:center;gap:8px;font-size:1.2rem;margin-top:4px}
.kcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.kcard{background:var(--surface);border-radius:20px;overflow:hidden;box-shadow:var(--sh);display:flex;flex-direction:column;transition:transform .15s ease,box-shadow .15s ease}
.kcard:hover{transform:translateY(-2px);box-shadow:var(--sh-lg)}
.kcover{position:relative;height:92px;display:flex;align-items:flex-end;justify-content:space-between;padding:10px 14px;color:#fff;background:var(--g)}
.kcover .kemo{font-size:2.6rem;line-height:1;filter:drop-shadow(0 3px 6px rgba(0,0,0,.18))}
.kcover .klevel{background:rgba(255,255,255,.22);border-radius:999px;padding:3px 10px;font-weight:700;font-size:.78rem;backdrop-filter:blur(2px)}
.kcover::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% 20%,rgba(255,255,255,.28) 0 18px,transparent 19px),radial-gradient(circle at 70% 70%,rgba(255,255,255,.14) 0 30px,transparent 31px)}
.kbody{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.kbody h3{font-size:1.12rem}
.kbody .meta{gap:6px 10px}
.kact{display:flex;gap:8px;margin-top:auto;padding-top:6px;flex-wrap:wrap}
.kact .btn{flex:1}
.btn.go{background:linear-gradient(135deg,#4B2FC4,#7B4BEA);border:0;color:#fff;min-height:44px;font-size:.98rem;box-shadow:0 4px 12px rgba(75,47,196,.28)}
.btn.go:hover{filter:brightness(1.07)}
.kempty{background:var(--surface);border-radius:20px;box-shadow:var(--sh);padding:28px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:6px}
.kempty .e{font-size:2.4rem}
.kres{display:flex;flex-direction:column;gap:10px}
.kr{background:var(--surface);border-radius:16px;box-shadow:var(--sh);padding:12px 14px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center}
.kr h3{font-size:1rem}
.ring{--p:0;--rc:var(--pen);width:54px;height:54px;border-radius:50%;display:grid;place-items:center;flex:none;
  background:conic-gradient(var(--rc) calc(var(--p)*1%),var(--sunk) 0)}
.ring span{width:42px;height:42px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-weight:800;font-size:.82rem;font-variant-numeric:tabular-nums}
.ring.big{width:120px;height:120px}
.ring.big span{width:96px;height:96px;flex-direction:column;font-family:var(--f-display);font-size:2rem;line-height:1}
.ring.big span small{font-family:var(--f-ui);font-size:.85rem;color:var(--muted);font-weight:700}

/* attempt */
.kback{align-self:flex-start;background:var(--surface);box-shadow:var(--sh);border:0}
.ktitle{display:flex;align-items:center;gap:10px;min-width:0}
.ktitle .kemo{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:1.5rem;background:var(--g);flex:none}
.ktitle h1{font-size:clamp(1.2rem,3.6vw,1.6rem)}
.banner{display:flex;gap:10px;align-items:flex-start;border-radius:14px}
.banner:before{content:"⏰";font-size:1rem;line-height:1.4}
.kid .banner{font-size:.9rem;padding:9px 13px}
.kid .p-head{display:none}
.kid .passage{padding-top:16px}
body.wopen main{padding-bottom:60vh}
.tabs{gap:6px!important;padding:6px!important;background:var(--surface)!important;border-radius:999px;box-shadow:var(--sh);margin-block:4px}
.tabs .btn{border:0;min-height:42px}
.tabs .btn[aria-pressed=true]{background:linear-gradient(135deg,#4B2FC4,#7B4BEA)!important;color:#fff!important}
@media (max-width:860px){.tabs{top:calc(var(--hdr) + 4px)}}
.pane-passage{border:0;box-shadow:var(--sh);border-radius:20px;background:#FFFDF8}
.annobar{background:#FFFDF8;border-radius:20px 20px 0 0;border-bottom:1px solid #F0EAE0}
.sw{border-radius:999px;border-color:#EAE3D6;background:#fff}
.sw.sw-m{background:var(--sun-soft);border-color:#F5DA9C}
.selhint{white-space:normal;line-height:1.35}
.passage{padding:20px 22px 24px}
.passage .p-head{padding-bottom:12px;border-bottom:2px dashed #EFE6D4}
.passage .p-head h2{font-size:1.6rem}
.p-head + .para p::first-letter{font-family:var(--f-display);font-weight:800;font-size:1.9em;line-height:1;color:var(--pen)}
.pn{color:#B4A98F}
@media (hover:none){.passage p[data-p]{cursor:pointer;-webkit-tap-highlight-color:transparent}}
.mk.wq{background:#FFE08A;box-shadow:0 0 0 3px #FFE08A;border-radius:4px}
.legend{padding:0 22px 18px}
.wlist{margin:0 16px 16px;padding:12px 14px;background:var(--sun-soft);border-radius:14px;display:flex;flex-direction:column;gap:8px;font-family:var(--f-ui)}
.wlist b{font-size:.88rem}
.wlist .chips button{min-height:32px;padding:0 12px;border-radius:999px;border:1px solid #F1D48A;background:#fff;font-weight:700;font-size:.86rem;cursor:pointer}
/* the sheet stays at the bottom of the passage box while it scrolls (laptop) */
@media (min-width:861px){#sheetSlot{position:sticky;bottom:0;z-index:6}#sheetSlot .sheet{position:relative}}
/* editor: boxes that grow with their text, one box per paragraph */
textarea.grow{resize:none;overflow:hidden;min-height:42px;line-height:1.45}
.pbox{display:grid;grid-template-columns:30px minmax(0,1fr);gap:8px;align-items:start}
.pbox .pn{padding-top:11px}
.pbox textarea{font-family:var(--f-read);font-size:1rem}
.pbox .ptools{grid-column:2;display:flex;gap:4px;flex-wrap:wrap;margin-top:-4px}
.pbox .ptools .btn{min-height:28px;font-size:.78rem;padding:0 8px}
.qtype-sel{width:auto;min-height:32px;padding:4px 8px;font-size:.84rem;font-weight:700;border-radius:999px}
.optrow{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:8px;align-items:start}
.optrow input[type=radio]{margin-top:12px}
.optrow b{padding-top:10px}
.checkbar{border-radius:14px;padding:12px 14px;background:var(--sun-soft);color:#6B4A00;font-weight:700;display:flex;gap:10px;align-items:flex-start}
/* word sheet */
.wsheet{border:0;box-shadow:0 14px 40px rgba(40,20,110,.25);border-top:5px solid var(--sun);gap:10px}
.wtop{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.wtop .ww{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.wword{font-family:var(--f-display);font-weight:800;font-size:1.5rem;line-height:1.1}
.wpos{background:var(--sky-soft);color:var(--sky);border-radius:999px;padding:2px 9px;font-weight:700;font-size:.76rem}
.wbtn{width:38px;height:38px;border-radius:50%;border:0;background:var(--sunk);cursor:pointer;font-size:1.05rem;display:grid;place-items:center;flex:none}
.wbase{font-size:.85rem;color:var(--muted)}
.wmean{font-size:1.08rem;font-weight:700;line-height:1.4}
.wphr{background:var(--mint-soft);color:#0B6B53;border-radius:10px;padding:7px 10px;font-size:.92rem}
.wex{background:var(--sunk);border-radius:10px;padding:7px 10px;font-family:var(--f-read);font-style:italic}
.wex b{font-family:var(--f-ui);font-style:normal;color:var(--muted);font-size:.78rem;display:block}
.wsim{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.85rem;color:var(--muted);font-weight:700}
.wsim span{background:var(--pen-soft);color:var(--pen);border-radius:999px;padding:2px 10px}
.wnote{border-left:3px solid var(--pen);padding:4px 10px;color:var(--pen);font-size:.92rem}
.wload{display:flex;align-items:center;gap:6px;color:var(--muted);font-weight:700}
.wload i{width:8px;height:8px;border-radius:50%;background:var(--sun);animation:wb 1s infinite ease-in-out}
.wload i:nth-child(2){animation-delay:.15s}.wload i:nth-child(3){animation-delay:.3s}
@keyframes wb{0%,80%,100%{transform:scale(.6);opacity:.5}40%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.wload i{animation:none}.kcard{transition:none}}

/* questions */
.booklet .sec{border-bottom:0;padding:4px 2px}
.booklet .sec h2{font-size:1.15rem}
.booklet > p.muted{background:var(--surface);border-radius:14px;padding:10px 14px;box-shadow:var(--sh)}
.qc{border:0;border-radius:18px;box-shadow:var(--sh);padding:16px 16px 18px;border-left:6px solid var(--line)}
.qc:nth-of-type(4n+1){border-left-color:#8B6CF0}.qc:nth-of-type(4n+2){border-left-color:#3FB8A0}.qc:nth-of-type(4n+3){border-left-color:#F2A93B}.qc:nth-of-type(4n){border-left-color:#E86A9A}
.qh{grid-template-columns:auto minmax(0,1fr) auto}
.qn{display:grid;place-items:center;min-width:42px;height:34px;padding:0 8px;border-radius:12px;background:var(--pen-soft);color:var(--pen);font-size:.95rem}
.qc.done .qn{background:var(--mint);color:#fff}
.qn{white-space:nowrap}
.qc.done .qn:after{content:"\00a0✓"}
.qm{background:var(--sunk);border-radius:999px;padding:2px 9px;font-size:.82rem}
.qtype{display:block;font-weight:700;font-size:.74rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-top:4px}
label.opt{position:relative;grid-template-columns:auto minmax(0,1fr);align-items:center;padding:11px 12px;border:2px solid var(--line-soft);border-radius:14px;background:#fff;transition:border-color .12s,background .12s}
label.opt input{position:absolute;opacity:0;pointer-events:none}
label.opt:hover{border-color:#CFC3F5}
label.opt:has(input:focus-visible){outline:3px solid var(--pen);outline-offset:2px}
.opt b{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--sunk);font-size:.9rem}
.opt > span:empty{display:none}
div.opt{grid-template-columns:auto minmax(0,1fr);align-items:center;border-radius:14px}
.opt.sel{border-color:var(--pen);background:var(--pen-soft)}
.opt.sel b{background:var(--pen);color:#fff}
.opt.key b{background:var(--good);color:#fff}
textarea.lined{background-color:#FFFDF8;border-radius:10px;padding:0 10px;border:1px solid #EFE6D4}
textarea.lined:focus{background-color:#fff;border-color:var(--pen);box-shadow:0 0 0 3px var(--pen-soft)}
.qc input[type=text]{border-radius:10px}
.tfseg span{padding:7px 16px;min-height:36px;display:inline-flex;align-items:center}
.tbl{border-radius:12px;overflow:hidden}
.kdone{background:linear-gradient(135deg,#FFF6DD,#FFE9F1);border:0;border-radius:20px;box-shadow:var(--sh);text-align:center;align-items:center}
.kdone .e{font-size:2.2rem}
.kdone .btn.go{min-width:220px}
.kdone .row{justify-content:center}

/* results */
.kscore{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center;border:0;border-radius:22px;box-shadow:var(--sh-lg);
  background:linear-gradient(135deg,#fff 0%,#F6F2FF 100%)}
.kscore .cheer{font-family:var(--f-display);font-weight:800;font-size:1.35rem}
.kstars{font-size:1.2rem;letter-spacing:2px}
@media (max-width:460px){.kscore{grid-template-columns:minmax(0,1fr);justify-items:center;text-align:center}.kscore .row{justify-content:center}}
.find{border-radius:14px}
.tip{border-radius:12px}
.key{border-radius:12px}
.teach{border-top:2px dashed var(--line-soft)}
.gf.add{text-decoration:none;font-weight:800;}
/* ===== ✨ Pupil look (body.stu): bright, friendly, modern. The teacher page is unchanged. ===== */
body.stu{
  --v1:#6C47FF; --v2:#9B5CFF; --pinkx:#FF6FAE; --mintx:#22C59B; --sunx:#FFB627; --skyx:#3BA7FF; --coral:#FF6B6B;
  --ink:#1B1433; --muted:#5E5780; --line:#E3DCF7; --pen:#6C47FF; --pen-soft:#EFEAFF;
  background:#F7F4FF radial-gradient(1200px 600px at -10% -10%, #E6DEFF 0%, transparent 60%) no-repeat,
    radial-gradient(900px 520px at 110% 0%, #DFF7EF 0%, transparent 60%) no-repeat,
    radial-gradient(900px 700px at 50% 120%, #FFE7F1 0%, transparent 65%) no-repeat;
  background-attachment:fixed;
}
body.stu h1, body.stu h2, body.stu h3{letter-spacing:-.015em}
body.stu .btn{border-radius:999px;font-weight:800;transition:transform .12s ease, box-shadow .12s ease, background .12s}
body.stu .btn:active{transform:translateY(2px)}
body.stu .btn.go, body.stu .btn.primary{background:linear-gradient(135deg,var(--v1),var(--v2));color:#fff;border:0;box-shadow:0 5px 0 #4A2DC2, 0 10px 22px -8px rgba(108,71,255,.55)}
body.stu .btn.go:hover, body.stu .btn.primary:hover{filter:brightness(1.06)}
body.stu .btn.go:active, body.stu .btn.primary:active{box-shadow:0 2px 0 #4A2DC2, 0 6px 14px -8px rgba(108,71,255,.55)}
body.stu .btn.small{box-shadow:0 2px 0 var(--line)}
body.stu .pill{border-radius:999px;font-weight:800}

/* --- home --- */
body.stu .khero{border-radius:30px;background:linear-gradient(125deg,#5B3BFF 0%,#8E54FF 45%,#FF6FAE 100%);box-shadow:0 22px 40px -22px rgba(91,59,255,.75);overflow:hidden;position:relative}
body.stu .khero::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 15% 120%,rgba(255,255,255,.22) 0 22%,transparent 23%),radial-gradient(circle at 92% -10%,rgba(255,255,255,.18) 0 18%,transparent 19%);pointer-events:none}
body.stu .khero .khi{display:inline-block;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);padding:4px 12px;border-radius:999px;backdrop-filter:blur(6px)}
body.stu .khero h1{font-size:clamp(1.9rem,6vw,2.6rem);text-shadow:0 2px 0 rgba(0,0,0,.08)}
body.stu .ksteps{counter-reset:ks}
body.stu .ksteps span{background:#fff;color:var(--v1);border:0;box-shadow:0 3px 0 rgba(0,0,0,.12);font-weight:800}
body.stu .ksteps i{opacity:.8}
body.stu .khero-art{animation:kfloat 4s ease-in-out infinite;filter:drop-shadow(0 10px 14px rgba(0,0,0,.18))}
@keyframes kfloat{50%{transform:translateY(-6px) rotate(-2deg)}}
body.stu .kstats div{border-radius:22px;border:0;background:#fff;box-shadow:0 1px 0 var(--line),0 14px 26px -18px rgba(27,20,51,.35);position:relative;overflow:hidden;padding-top:14px}
body.stu .kstats div::before{position:absolute;right:10px;top:8px;font-size:24px;opacity:.9}
body.stu .kstats div:nth-child(1)::before{content:"📝"} body.stu .kstats div:nth-child(2)::before{content:"✅"} body.stu .kstats div:nth-child(3)::before{content:"🏅"}
body.stu .kstats div::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--c)}
body.stu .kstats b{font-size:2rem;background:linear-gradient(135deg,var(--ink),var(--c));-webkit-background-clip:text;background-clip:text;color:transparent}
body.stu .ksec{font-size:1.35rem;display:flex;align-items:center;gap:8px}
body.stu .kcard{border-radius:26px;border:0;overflow:hidden;background:#fff;box-shadow:0 1px 0 var(--line),0 18px 34px -22px rgba(27,20,51,.45);transition:transform .18s ease, box-shadow .18s ease}
body.stu .kcard:hover{transform:translateY(-3px) rotate(-.2deg);box-shadow:0 1px 0 var(--line),0 26px 40px -22px rgba(27,20,51,.5)}
body.stu .kcover{min-height:118px;background:var(--g);position:relative}
body.stu .kcover::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.28) 1.5px,transparent 1.6px);background-size:16px 16px;mask-image:linear-gradient(90deg,transparent 30%,#000)}
body.stu .kcover .kemo{background:#fff;border-radius:22px;width:66px;height:66px;display:grid;place-items:center;font-size:36px;box-shadow:0 8px 18px -6px rgba(0,0,0,.35);transform:rotate(-8deg);position:relative;z-index:1}
body.stu .kcover .klevel{background:rgba(255,255,255,.92);color:var(--ink);border-radius:999px;font-weight:800;z-index:1}
body.stu .kbody h3{font-size:1.25rem}
body.stu .kempty{border-radius:24px;border:2px dashed #D6CCF6;background:rgba(255,255,255,.7)}
body.stu .kr{border-radius:22px;border:0;background:#fff;box-shadow:0 1px 0 var(--line),0 12px 24px -18px rgba(27,20,51,.35)}
body.stu .ring{background:conic-gradient(var(--rc) calc(var(--p)*1%), #EEE9FB 0)}

/* --- reading and answering --- */
body.stu .kback{background:#fff}
body.stu .ktitle .kemo{border-radius:20px;box-shadow:0 8px 16px -8px rgba(0,0,0,.35);transform:rotate(-6deg)}
body.stu .tabs{position:sticky;top:8px;z-index:30;background:rgba(255,255,255,.78);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);border:1px solid rgba(255,255,255,.9);box-shadow:0 10px 26px -16px rgba(27,20,51,.45)}
body.stu .tabs .btn[aria-pressed=true]{background:linear-gradient(135deg,var(--v1),var(--v2));box-shadow:0 4px 0 #4A2DC2}
body.stu .annobar{border-radius:22px 22px 0 0;background:#FFFDF6}
body.stu .annobar .tools{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:2px;mask-image:linear-gradient(90deg,#000 88%,transparent)}
body.stu .annobar .tools::-webkit-scrollbar{display:none}
body.stu .sw{flex:none;border-radius:999px;box-shadow:0 2px 0 var(--line);font-weight:800}
body.stu .passage{border-radius:0 0 26px 26px;box-shadow:0 18px 34px -24px rgba(27,20,51,.45)}
body.stu .para p{font-size:1.1rem;line-height:1.95}
body.stu .pn{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:50%;background:#F1ECFF;color:var(--v1);font:800 12px/1 var(--f-ui)}
body.stu .p-head + .para p::first-letter{background:linear-gradient(135deg,var(--v1),var(--pinkx));-webkit-background-clip:text;background-clip:text;color:transparent}
body.stu .mk.wq, body.stu .passage [data-p] span:hover{transition:background .15s}
body.stu .qc{border-radius:26px;border:0;background:#fff;box-shadow:0 1px 0 var(--line),0 16px 30px -22px rgba(27,20,51,.45)}
body.stu .qn{border-radius:14px;background:linear-gradient(135deg,var(--v1),var(--v2));color:#fff;box-shadow:0 3px 0 #4A2DC2}
body.stu .qc.done .qn{background:linear-gradient(135deg,#16B386,#3FD3A5);box-shadow:0 3px 0 #0E8A66}
body.stu .qm{border-radius:999px;background:#FFF3D6;color:#8A5A00;font-weight:800}
body.stu label.opt, body.stu div.opt{border-radius:18px;border:2px solid var(--line);transition:border-color .15s, background .15s, transform .1s}
body.stu label.opt:hover{border-color:#C9BBFF;background:#FBF9FF}
body.stu label.opt:active{transform:scale(.99)}
body.stu .opt.sel{border-color:var(--v1);background:#F3EFFF;box-shadow:0 0 0 4px rgba(108,71,255,.12)}
body.stu .opt.sel b{background:var(--v1);color:#fff}
body.stu textarea.lined, body.stu .qc input[type=text]{border-radius:16px;border:2px solid var(--line);background-color:#fff;font-size:1.05rem;transition:border-color .15s, box-shadow .15s}
body.stu textarea.lined{background-image:repeating-linear-gradient(transparent 0 calc(1.7em - 1px), #EDE8FA calc(1.7em - 1px) 1.7em);background-attachment:local;line-height:1.7em;padding-top:.35em}
body.stu textarea.lined:focus, body.stu .qc input[type=text]:focus{outline:none;border-color:var(--v1);box-shadow:0 0 0 4px rgba(108,71,255,.15)}
body.stu .checkbar{border-radius:24px;background:rgba(255,255,255,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 14px 30px -18px rgba(27,20,51,.5)}
body.stu .wsheet{border-radius:26px 26px 0 0;box-shadow:0 -14px 40px -10px rgba(27,20,51,.35)}
body.stu .wword{background:linear-gradient(135deg,var(--v1),var(--pinkx));-webkit-background-clip:text;background-clip:text;color:transparent}
body.stu .wlist .chips button{border-radius:999px}

/* --- marks --- */
body.stu .kdone, body.stu .kscore{border-radius:28px}
body.stu .tip{border-radius:16px}
body.stu .key{border-radius:16px}
body.stu .teach{border-radius:18px}

/* --- 🎉 confetti for a good score --- */
.kconf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9999}
.kconf i{position:absolute;top:-14px;width:9px;height:14px;border-radius:2px;opacity:.95;animation:kfall 2.4s cubic-bezier(.2,.6,.4,1) forwards}
@keyframes kfall{to{transform:translate3d(var(--dx),105vh,0) rotate(var(--r));opacity:.9}}
@media (prefers-reduced-motion:reduce){ body.stu .khero-art{animation:none} .kconf{display:none} body.stu .kcard:hover{transform:none} }
@media (max-width:520px){ body.stu .kcover{min-height:100px} body.stu .para p{font-size:1.05rem} }
body.stu .qc.done .qn{position:relative;overflow:visible}
body.stu .qc.done .qn:after{content:"✓";position:absolute;inset:-7px -7px auto auto;width:20px;height:20px;margin:0;border-radius:50%;background:#fff;color:#0E8A66;display:grid;place-items:center;font:900 12px/1 var(--f-ui);box-shadow:0 2px 6px rgba(0,0,0,.18);transform:none;border:0}
</style>

<body>
<header class="bar">
  <div class="brand"><span class="nib">EL</span><span>Comprehension</span></div>
  <span class="sp"></span>
  <span class="who" id="who"></span>
  <span id="barActions" class="row"></span>
</header>
<main id="app"><p class="muted">Loading…</p></main>
<div id="busy" hidden></div>
<div id="toast" hidden></div>

<script>var BOOT = <?!= boot ?>;</script>
<script>
(function(){
'use strict';

/* ---------- utilities ---------- */
var $ = function(s, r){ return (r||document).querySelector(s); };
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
var LS = {
  get:function(k,d){ try{ var v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
  set:function(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del:function(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
function slug(s){ return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''); }
function fmtMarks(n){ n=Number(n)||0; return (Math.round(n*2)/2).toString().replace('.5','½').replace(/^0½/,'½'); }
function pct(a,b){ return b ? Math.round(100*a/b) : 0; }
function when(t){ if(!t) return ''; var d=new Date(t); return d.toLocaleDateString('en-SG',{day:'numeric',month:'short'})+' '+d.toLocaleTimeString('en-SG',{hour:'numeric',minute:'2-digit'}); }
function deepCopy(o){ return JSON.parse(JSON.stringify(o)); }
function normCls(c){ return String(c||'').trim().toLowerCase().replace(/\s+/g,''); }
function fmtDue(ms){ var d=new Date(ms); return d.toLocaleDateString('en-SG',{weekday:'short',day:'numeric',month:'short'})+', '+d.toLocaleTimeString('en-SG',{hour:'numeric',minute:'2-digit'}); }
function toLocalInput(ms){ if(!ms) return ''; var d=new Date(ms); var z=function(n){ return (n<10?'0':'')+n; }; return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())+'T'+z(d.getHours())+':'+z(d.getMinutes()); }
function defaultDue(){ var d=new Date(); d.setDate(d.getDate()+7); d.setHours(23,59,0,0); return d.getTime(); }
/* Due-date pill for a pupil: closed / overdue / due soon / due later */
function duePill(info){
  if(!info || !info.due) return '';
  var now=Date.now(), left=info.due-now;
  if(left<=0) return info.lock ? '<span class="pill zero">Closed · was due '+esc(fmtDue(info.due))+'</span>' : '<span class="pill part">Overdue · was due '+esc(fmtDue(info.due))+'</span>';
  if(left<36e5) return '<span class="pill part">Due in '+Math.max(1,Math.round(left/6e4))+' min</span>';
  if(left<24*36e5) return '<span class="pill part">Due in '+Math.round(left/36e5)+' h · '+esc(new Date(info.due).toLocaleTimeString('en-SG',{hour:'numeric',minute:'2-digit'}))+'</span>';
  return '<span class="pill">Due '+esc(fmtDue(info.due))+'</span>';
}
var TYPE_LABEL = {mcq:'Multiple choice', short:'Short answer', open:'Open-ended', sequence:'Sequencing', referent:'Referent', vocab:'Vocabulary', truefalse:'True / False with reason', structured:'Structured'};
var SKILLS = ['Literal','Inferential','Vocabulary','Referencing','Sequencing','Evidence','Evaluative'];

function call(action, payload){
  return new Promise(function(resolve, reject){
    var done=function(r){ var o; try{ o=JSON.parse(r); }catch(e){ return reject(new Error('Unexpected reply from the server.')); } o.ok ? resolve(o.data) : reject(new Error(o.error)); };
    var fail=function(e){ reject(new Error(e && e.message ? e.message : String(e))); };
    if(BOOT.bridge){ try{ window.parent.cmBridge(action, JSON.stringify(payload||{})).then(done, fail); }catch(e){ fail(new Error('Please open the Comprehension tab again.')); } return; }
    if(!window.google || !google.script || !google.script.run) return reject(new Error('Open this page from your Dashboard.'));
    google.script.run.withSuccessHandler(done).withFailureHandler(fail).cmTeacher(action, JSON.stringify(payload||{}), BOOT.cred);
  });
}

var toastTimer;
function toast(msg){ var t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(function(){ t.hidden=true; }, 3200); }

var busyTimer;
function busy(title, steps, note){
  var el=$('#busy'); var start=Date.now(); var cur=0;
  function draw(){
    el.innerHTML='<div class="busy-card" role="status" aria-live="polite"><h2>'+esc(title)+'</h2>'+
      '<ol class="steps">'+steps.map(function(s,i){ return '<li class="'+(i<cur?'done':i===cur?'on':'')+'">'+esc(s)+'</li>'; }).join('')+'</ol>'+
      '<p class="muted small">'+esc(note||'This usually takes under a minute.')+' <span id="busySec"></span></p></div>';
  }
  draw(); el.hidden=false;
  clearInterval(busyTimer);
  busyTimer=setInterval(function(){ var s=$('#busySec'); if(s) s.textContent=Math.round((Date.now()-start)/1000)+'s'; },1000);
  return { step:function(i){ cur=i; draw(); }, done:function(){ clearInterval(busyTimer); el.hidden=true; el.innerHTML=''; } };
}

/* ---------- state ---------- */
/* 🌿 Calm feedback: inside the Class Hub the pupil's results use the Hub's calm look (CF) and quick lessons. */
var PCF = (function(){ try { return window.parent !== window && window.parent.CF && window.parent.LESSONS ? window.parent.CF : null; } catch(e){ return null; } })();
var PLES = PCF ? window.parent.LESSONS : {}, PCM = PCF ? window.parent.CF_CM : {};
if(PCF){ try { PCF.inject(document); } catch(e){} document.addEventListener('click', function(e){ PCF.tap(e.target); }); }
function calmOn(){ return !!PCF && S.view==='student' && S.route.name==='attempt'; }
function skillId(q){ return PCM[String(q.skill||'').toLowerCase()] || (q.type==='vocab'?'cs-vocab':q.type==='referent'?'cs-ref':q.type==='truefalse'?'cs-tf':q.type==='sequence'?'cs-seq':''); }
function calmAns(text, gl){
  var marks=(gl||[]).filter(function(g){ return g && g.wrong; }).map(function(g){ return {wrong:g.wrong, fix:g.fix, type:'grammar'}; });
  return '<div class="cf"><div class="cf-sent" style="font-size:17.5px">'+PCF.anno(text, marks, function(){ return ''; })+'</div></div>'+(marks.length?'<div class="muted small" style="margin-top:2px">✏️ Grammar fixes shown in orange: no marks taken off.</div>':'');
}
var S = {
  view: BOOT.view,
  pin: '',
  student: BOOT.student || {name:'',cls:''},
  route: {name:'home'},
  list:null, results:null, loadErr:'', classes:null,
  dash:null,
  attempt:null,
  editor:null,
  subs:null, review:null,
  confirm:null
};

/* ---------- clue + annotation geometry ---------- */
function norm(s){ return String(s).replace(/[‘’`]/g,"'").replace(/[“”]/g,'"').replace(/[–—]/g,'-').toLowerCase(); }
function findClue(paras, quote){
  if(!quote || !paras) return null;
  var q=norm(quote).trim().replace(/^["'.,;:…\s]+|["'.,;:…\s]+$/g,'');
  var chunks=q.split(/\s*(?:\.\.\.|…)\s*/).filter(Boolean).sort(function(a,b){ return b.length-a.length; });
  for(var c=0;c<chunks.length;c++){
    if(chunks[c].length<3) continue;
    for(var i=0;i<paras.length;i++){
      var j=norm(paras[i]).indexOf(chunks[c]);
      if(j>=0) return {p:i,start:j,end:j+chunks[c].length};
    }
  }
  var words={}; (q.match(/[a-z']+/g)||[]).forEach(function(w){ if(w.length>2) words[w]=1; });
  var n=Object.keys(words).length; if(!n) return null;
  var best=null, bs=0;
  paras.forEach(function(t,i){
    var re=/[^.!?]+[.!?]*["']?\s*/g, m;
    while((m=re.exec(t))){
      var sw=norm(m[0]).match(/[a-z']+/g)||[]; var hit=0, seen={};
      sw.forEach(function(w){ if(words[w] && !seen[w]){ hit++; seen[w]=1; } });
      var sc=hit/Math.max(4,n);
      if(sc>bs){ bs=sc; best={p:i,start:m.index,end:m.index+m[0].replace(/\s+$/,'').length}; }
    }
  });
  return bs>=0.3 ? best : null;
}

function paraHTML(text, ranges){
  var pts={0:1}; pts[text.length]=1;
  ranges.forEach(function(r){ pts[Math.max(0,Math.min(text.length,r.start))]=1; pts[Math.max(0,Math.min(text.length,r.end))]=1; });
  var arr=Object.keys(pts).map(Number).sort(function(a,b){ return a-b; });
  var out='';
  for(var i=0;i<arr.length-1;i++){
    var a=arr[i], b=arr[i+1]; if(b<=a) continue;
    var seg=esc(text.slice(a,b));
    var cov=ranges.filter(function(r){ return r.start<=a && r.end>=b; });
    if(!cov.length){ out+=seg; continue; }
    var cls=[], ids=[];
    cov.forEach(function(r){ cls.push(r.cls); ids.push(r.id); if(r.end===b && r.marker) cls.push(r.marker); });
    out+='<span class="mk '+cls.join(' ')+'" data-mk="'+esc(ids.join(' '))+'">'+seg+'</span>';
  }
  return out;
}

function passageHTML(p, o){
  o=o||{};
  var per=p.paragraphs.map(function(){ return []; });
  if(o.showAi){
    (p.aiNotes||[]).forEach(function(n,i){
      var loc=findClue(p.paragraphs, n.quote); if(!loc) return;
      per[loc.p].push({start:loc.start,end:loc.end,cls:'ai',id:'a:'+i,marker:'ne-ai'});
    });
  }
  (o.annos||[]).forEach(function(a){
    if(!per[a.p]) return;
    per[a.p].push({start:a.start,end:a.end,cls:'hl-'+a.style,id:'u:'+a.id,marker:a.note?'ne-u':''});
  });
  if(o.word && per[o.word.p]) per[o.word.p].push({start:o.word.start,end:o.word.end,cls:'wq',id:'w:0'});
  if(o.clue && per[o.clue.p]) per[o.clue.p].push({start:o.clue.start,end:o.clue.end,cls:'clue'+(o.flash?' flash':''),id:'c:0'});
  return '<article class="passage" id="passage">'+
    '<div class="p-head"><span class="eyebrow">'+esc(p.level)+' · '+esc(p.genre||'Comprehension')+'</span><h2>'+esc(p.title)+'</h2></div>'+
    p.paragraphs.map(function(t,i){ return '<div class="para"><span class="pn">'+(i+1)+'</span><p data-p="'+i+'">'+paraHTML(t, per[i])+'</p></div>'; }).join('')+
    '</article>'+
    '<div class="legend"><span><i style="background:none;border-bottom:2px solid var(--pen)"></i>AI pen notes</span><span><i style="background:var(--clue-bg)"></i>Clue for an answer</span><span><i style="background:var(--hl-y)"></i>Your highlights</span><span><i style="background:#FFE08A"></i>Tap a word for its meaning</span></div>';
}

/* ---------- answers rendering ---------- */
function numbering(qs){
  var n=0, map={};
  qs.forEach(function(q){ map[q.id]=++n; });
  return map;
}
/* The pupil's answer with grammar, spelling and punctuation corrections marked on it. gl: [{wrong, fix, rule}] */
function gramAns(text, gl){
  text=String(text||''); gl=(gl||[]).filter(function(g){ return g && g.wrong; });
  var h='', cur=0, low=text.toLowerCase(), used=[];
  gl.map(function(g){ var at=low.indexOf(String(g.wrong).toLowerCase()); return {g:g, at:at}; }).filter(function(x){ return x.at>=0; })
    .sort(function(a,b){ return a.at-b.at; }).forEach(function(x){
      if(x.at<cur) return;
      var orig=text.substr(x.at,x.g.wrong.length), fx=String(x.g.fix||''), w=String(x.g.wrong);
      if(fx.length>w.length && fx.toLowerCase().indexOf(w.toLowerCase())===0) h+=esc(text.slice(cur,x.at))+esc(orig)+'<ins class="gf add">'+esc(fx.slice(w.length).replace(/^\s+/,' '))+'</ins>';
      else if(fx.length>w.length && fx.toLowerCase().slice(-w.length)===w.toLowerCase()) h+=esc(text.slice(cur,x.at))+'<ins class="gf add">'+esc(fx.slice(0,fx.length-w.length))+'</ins>'+esc(orig);
      else h+=esc(text.slice(cur,x.at))+'<s class="gw">'+esc(orig)+'</s><ins class="gf">'+esc(fx)+'</ins>';
      cur=x.at+x.g.wrong.length; used.push(x.g);
    });
  h+=esc(text.slice(cur));
  return {html:h, notes:gl};
}
function gramBox(text, gl, prefix){
  var r=gramAns(text, gl);
  var out='<div class="ans">'+(prefix||'')+r.html+'</div>';
  if(r.notes.length) out+='<div class="gram"><div class="gram-h">✏️ Grammar check <span>No marks taken off</span></div><ul>'+r.notes.map(function(g){
    var f=String(g.fix||''), w=String(g.wrong), pre=f.length>w.length && f.toLowerCase().indexOf(w.toLowerCase())===0, post=f.length>w.length && f.toLowerCase().slice(-w.length)===w.toLowerCase();
    return '<li>'+(pre||post ? 'Add <b>“'+esc(pre?f.slice(w.length).trim():f.slice(0,f.length-w.length).trim())+'”</b> '+(pre?'after':'before')+' “'+esc(w)+'”' : '<s>'+esc(g.wrong)+'</s> → <b>'+esc(f)+'</b>')+(g.rule?'<span class="gr">'+esc(g.rule)+'</span>':'')+'</li>'; }).join('')+'</ul></div>';
  return out;
}
function verdict(aw,max){ return aw>=max ? 'v-full' : aw>0 ? 'v-part' : 'v-zero'; }

function answerView(q, a){
  function box(t){ return t ? '<div class="ans">'+esc(t)+'</div>' : '<div class="ans blank">No answer</div>'; }
  if(q.type==='mcq'){
    return '<div class="opts">'+(q.options||[]).map(function(o,i){
      var cls = (a!==undefined && a!=='' && Number(a)===i) ? ' sel' : '';
      if(q.answer!==undefined && Number(q.answer)===i) cls+=' key';
      return '<div class="opt'+cls+'"><span></span><b>('+(i+1)+')</b><span>'+esc(o)+'</span></div>';
    }).join('')+'</div>';
  }
  if(q.type==='sequence'){
    return '<div class="tblwrap"><table class="tbl"><tr><th>Event</th><th>Your order</th>'+(q.events[0] && q.events[0].order!==undefined?'<th>Correct</th>':'')+'</tr>'+
      (q.events||[]).map(function(ev,i){ return '<tr><td>'+esc(ev.text)+'</td><td>'+esc((a||{})[i]||'—')+'</td>'+(ev.order!==undefined?'<td>'+ev.order+'</td>':'')+'</tr>'; }).join('')+'</table></div>';
  }
  return '';
}

/* ---------- teaching feedback under a marked answer ---------- */
function teachTitle(m, blank){
  if(m.awarded>=m.max) return 'Why this is correct';
  if(blank) return 'What was needed';
  if(m.awarded>0) return 'What you got, and what was missing';
  return 'Why this is not correct';
}
/* o: {m, qid, part, answer, blank, steps (bool), tip (bool), sub (bool: a part inside a question), chip (bool), extra} */
function teachHTML(o){
  var m=o.m; if(!m) return '';
  if(calmOn()){
    var full=m.awarded>=m.max, c='<div class="cf" style="margin-top:6px">';
    if(o.chip!==false && !o.sub) c+='<div class="cf-qh" style="margin:0"><span class="cf-chip '+PCF.lvl(m.awarded,m.max)+'">'+fmtMarks(m.awarded)+' / '+fmtMarks(m.max)+'</span>'+(full?'<span class="cf-tag2">✓ Correct</span>':'')+'</div>';
    else if(o.sub) c+='<span class="cf-chip '+PCF.lvl(m.awarded,m.max)+'">'+fmtMarks(m.awarded)+' / '+fmtMarks(m.max)+'</span>';
    if(!full){
      c+=PCF.pts(m.got, m.missing);
      if(o.answer) c+=PCF.ok(o.answer, 'Answer');
      if(!(m.got||[]).length && !(m.missing||[]).length && m.feedback) c+='<p class="cf-fb">💡 '+esc(m.feedback)+'</p>';
      if(m.clue) c+='<button class="quote" data-act="clue" data-q="'+o.qid+'"'+(o.part!=null?' data-part="'+o.part+'"':'')+' style="margin-top:8px">🔍 “'+esc(m.clue)+'”<span>'+(m.para?'Paragraph '+m.para+' · ':'')+'Tap to see it in the passage</span></button>';
      if(o.steps!==false && m.steps && m.steps.length) c+='<details class="cf-more" style="box-shadow:none;border:2px solid #E4DEF6"><summary>🧠 How to work it out</summary><ol class="think">'+m.steps.map(function(x){ return '<li>'+esc(x)+'</li>'; }).join('')+'</ol></details>';
    }
    if(o.extra) c+=o.extra;
    return c+'</div>';
  }
  var h='<div class="teach'+(o.sub?' sub':'')+'">';
  h+='<div class="teach-h">'+(o.chip!==false?'<span class="chip '+verdict(m.awarded,m.max)+'">'+fmtMarks(m.awarded)+' / '+fmtMarks(m.max)+'</span>':'')+'<b>'+teachTitle(m,o.blank)+'</b></div>';
  if(m.feedback) h+='<p>'+esc(m.feedback)+'</p>';
  if(o.answer) h+='<div class="key"><b>Correct answer</b>\n'+esc(o.answer)+'</div>';
  if(m.clue){
    h+='<div class="find"><div class="find-h">🔍 How to find it'+(m.para?' · Paragraph '+m.para:'')+'</div>'+
      '<button class="quote" data-act="clue" data-q="'+o.qid+'"'+(o.part!=null?' data-part="'+o.part+'"':'')+'>“'+esc(m.clue)+'”<span>Tap to see it in the passage</span></button>';
    if(o.steps!==false && m.steps && m.steps.length) h+='<ol class="think">'+m.steps.map(function(x){ return '<li>'+esc(x)+'</li>'; }).join('')+'</ol>';
    h+='</div>';
  }
  if(o.tip!==false && m.tip) h+='<p class="tip"><b>💡 Remember:</b> '+esc(m.tip)+'</p>';
  if(o.extra) h+=o.extra;
  return h+'</div>';
}
/* correct answer text for the teacher, straight from the passage's key */
function teacherKey(q, pid){
  if(q.type==='mcq') return '('+(Number(q.answer)+1)+') '+((q.options||[])[q.answer]||'');
  if(q.type==='sequence') return (q.events||[]).slice().sort(function(a,b){ return a.order-b.order; }).map(function(e){ return e.order+'. '+e.text; }).join('\n');
  if(pid!=null && q.parts){ var pt=q.parts.filter(function(x){ return x.id===pid; })[0]; return pt?pt.model:''; }
  if(pid!=null && q.statements){ var st=q.statements[Number(String(pid).slice(1))]; return st?st.answer+'. '+st.reason:''; }
  return q.model||'';
}
function keyFor(ctx, q, pid){
  if(ctx.reviewKey) return teacherKey(q, pid);
  if(pid!=null) return ((ctx.keyParts||{})[q.id]||{})[pid]||'';
  return (ctx.keys||{})[q.id]||'';
}
function isBlank(v){ return v===undefined || v===null || v==='' || (typeof v==='object' && !Object.keys(v).some(function(k){ var x=v[k]; return x && (typeof x!=='object' || x.tf || x.reason); })); }

function qCard(q, num, ctx){
  var mode=ctx.mode, ans=ctx.answers||{}, a=ans[q.id], m=ctx.marks?ctx.marks[q.id]:null;
  var ro = mode!=='answer';
  var h='<section class="qc" id="q-'+q.id+'"><div class="qh"><span class="qn">Q'+num+'</span><div class="qp">'+esc(q.prompt)+(mode==='answer'&&TYPE_LABEL[q.type]?'<span class="qtype">'+esc(TYPE_LABEL[q.type])+'</span>':'')+'</div><span class="qm">['+fmtMarks(q.marks)+']</span></div>';

  if(q.type==='mcq'){
    if(ro){ h+=answerView(ctx.reviewKey?q:{type:'mcq',options:q.options}, a); }
    else h+='<div class="opts" role="radiogroup">'+(q.options||[]).map(function(o,i){
      var on = a!==undefined && a!=='' && Number(a)===i;
      return '<label class="opt'+(on?' sel':'')+'"><input type="radio" name="r-'+q.id+'" value="'+i+'" data-bind="'+q.id+'"'+(on?' checked':'')+'><b>('+(i+1)+')</b><span>'+esc(o)+'</span></label>';
    }).join('')+'</div>';
  }
  else if(q.type==='sequence'){
    if(ro) h+=answerView(ctx.reviewKey?q:{type:'sequence',events:(q.events||[]).map(function(e){return {text:e.text};})}, a);
    else {
      var n=(q.events||[]).length;
      h+='<div class="tblwrap"><table class="tbl"><tr><th>Event</th><th>Order</th></tr>'+(q.events||[]).map(function(ev,i){
        var v=(a||{})[i]||'';
        var opts='<option value="">–</option>'; for(var k=1;k<=n;k++) opts+='<option'+(String(v)===String(k)?' selected':'')+'>'+k+'</option>';
        return '<tr><td>'+esc(ev.text)+'</td><td><select class="ord" data-bind="'+q.id+'|'+i+'" aria-label="Order for event '+(i+1)+'">'+opts+'</select></td></tr>';
      }).join('')+'</table></div>';
    }
  }
  else if(q.parts && q.parts.length){
    h+='<div class="parts">'+q.parts.map(function(pt){
      var v=(a||{})[pt.id]||'';
      var pm = m && m.parts ? m.parts[pt.id] : null;
      var body = ro ? (v?(calmOn()?calmAns(v, pm && pm.grammar):gramBox(v, pm && pm.grammar)):'<div class="ans blank">No answer</div>')
        : (q.type==='structured'
            ? '<textarea class="lined" rows="2" data-bind="'+q.id+'|'+pt.id+'" aria-label="Part '+pt.id+'">'+esc(v)+'</textarea>'
            : '<input type="text" data-bind="'+q.id+'|'+pt.id+'" value="'+esc(v)+'" aria-label="Part '+pt.id+'">');
      var extra='';
      if(ro && pm) extra=teachHTML({m:pm, qid:q.id, part:pt.id, answer:keyFor(ctx,q,pt.id), blank:!v, tip:false, sub:true});
      else if(ro && ctx.reviewKey && pt.model) extra='<div class="key"><b>Correct answer</b>\n'+esc(pt.model)+'</div>';
      return '<div class="part"><span class="pl">('+esc(pt.id)+')</span><div class="stack" style="gap:6px"><div>'+esc(pt.label||'')+' <span class="qm small">['+fmtMarks(pt.marks)+']</span></div>'+body+extra+'</div></div>';
    }).join('')+'</div>';
  }
  else if(q.statements && q.statements.length){
    h+='<div class="parts">'+q.statements.map(function(st,i){
      var v=(a||{})[i]||{};
      var pm = m && m.parts ? m.parts['s'+i] : null;
      var body;
      if(ro){
        body= v.tf ? (calmOn()?'<div><b>'+esc(v.tf)+'</b></div>'+calmAns(v.reason||'(no reason)', pm && pm.grammar):gramBox(v.reason||'(no reason)', pm && pm.grammar, '<b>'+esc(v.tf)+'</b> — ')) : '<div class="ans blank">No answer</div>';
        if(pm) body+=teachHTML({m:pm, qid:q.id, part:'s'+i, answer:keyFor(ctx,q,'s'+i), blank:!v.tf, tip:false, sub:true});
        else if(ctx.reviewKey && st.answer) body+='<div class="key"><b>Correct answer</b>\n'+esc(st.answer)+'. '+esc(st.reason||'')+'</div>';
      } else {
        body='<div class="tfseg">'+['True','False'].map(function(t){
          return '<label><input type="radio" name="tf-'+q.id+'-'+i+'" value="'+t+'" data-bind="'+q.id+'|'+i+'|tf"'+(v.tf===t?' checked':'')+'><span>'+t+'</span></label>';
        }).join('')+'</div><input type="text" placeholder="Reason" data-bind="'+q.id+'|'+i+'|reason" value="'+esc(v.reason||'')+'" aria-label="Reason for statement '+(i+1)+'">';
      }
      return '<div class="part"><span class="pl">'+(i+1)+'.</span><div class="stack" style="gap:6px"><div>'+esc(st.text)+' <span class="qm small">['+fmtMarks(st.marks||1)+']</span></div>'+body+'</div></div>';
    }).join('')+'</div>';
  }
  else {
    var rows = q.marks>=3 ? 5 : q.marks>=2 ? 4 : 2;
    h+= ro ? (a?(calmOn()?calmAns(a, m && m.grammar):gramBox(a, m && m.grammar)):'<div class="ans blank">No answer</div>')
           : '<textarea class="lined" rows="'+rows+'" data-bind="'+q.id+'" aria-label="Answer for question '+num+'">'+esc(a||'')+'</textarea>';
  }

  if(ro && m){
    var multi=!!(q.parts||q.statements);
    var review = mode==='review' ? '<label class="row small" style="gap:6px;font-weight:700">Teacher mark <input type="number" min="0" max="'+q.marks+'" step="0.5" value="'+m.awarded+'" data-ovr="'+q.id+'"></label>' : '';
    if(multi && calmOn()){
      h+='<div class="cf" style="margin-top:8px"><div class="cf-qh"><span class="cf-chip '+PCF.lvl(m.awarded,m.max)+'">'+fmtMarks(m.awarded)+' / '+fmtMarks(m.max)+' marks</span><b style="font-size:14px">Question total</b></div></div>';
    } else if(multi){
      // the parts carry their own lessons; show the total, the overall comment and the strategy tip
      h+='<div class="teach total"><div class="row between"><div class="teach-h"><span class="chip '+verdict(m.awarded,m.max)+'">'+fmtMarks(m.awarded)+' / '+fmtMarks(m.max)+' marks</span><b>Question total</b></div>'+review+'</div>'+
        (m.feedback?'<p>'+esc(m.feedback)+'</p>':'')+(m.tip?'<p class="tip"><b>Remember:</b> '+esc(m.tip)+'</p>':'')+'</div>';
    } else {
      var ms = (mode==='review' && q.markScheme) ? '<div class="key"><b>Mark scheme</b>\n'+esc(q.markScheme)+'</div>' : '';
      if(review) ms+='<div class="row" style="justify-content:flex-end">'+review+'</div>';
      h+=teachHTML({m:m, qid:q.id, answer:keyFor(ctx,q), blank:isBlank(a), extra:ms});
    }
  } else if(ro && !m && mode!=='answer'){
    h+='<p class="muted small">Not marked yet.</p>';
  }
  return h+'</section>';
}

function calmLessons(p, ctx){
  if(!calmOn() || ctx.mode!=='result' || !ctx.marks) return '';
  var items=[];
  p.questions.forEach(function(q){ var m=ctx.marks[q.id]; if(!m || m.awarded>=m.max) return; var id=skillId(q), L=PLES[id]; if(!L) return; items.push({id:id, lesson:{t:L.t, r:m.tip||L.r, x:L.x, k:L.k}}); });
  return PCF.lessons(items, 'Quick lessons');
}
function bookletHTML(p, ctx){
  var nums=numbering(p.questions);
  var Q=p.questions;
  var sum=function(l){ return l.reduce(function(s,q){ return s+(Number(q.marks)||0); },0); };
  var h='<div class="booklet">';
  if(Q.length) h+='<div class="sec"><h2>Questions</h2><span class="qm">'+fmtMarks(sum(Q))+' marks</span></div>'+
    '<p class="muted small">Read the passage and answer the questions. For multiple-choice questions, choose the correct answer. Write in complete sentences where needed.</p>'+Q.map(function(q){ return qCard(q, nums[q.id], ctx); }).join('');
  var A=[], B=[];
  if(A.length) h+='<div class="sec"><h2>Booklet A · Multiple choice</h2><span class="qm">'+fmtMarks(sum(A))+' marks</span></div>'+
    '<p class="muted small">Choose the correct answer and shade its number.</p>'+A.map(function(q){ return qCard(q, nums[q.id], ctx); }).join('');
  if(B.length) h+='<div class="sec"><h2>Booklet B · Open-ended</h2><span class="qm">'+fmtMarks(sum(B))+' marks</span></div>'+
    '<p class="muted small">Read the passage and answer the questions. Write in complete sentences where needed.</p>'+B.map(function(q){ return qCard(q, nums[q.id], ctx); }).join('');
  h+=calmLessons(p, ctx);
  return h+'</div>';
}

/** 🎉 Confetti when a pupil's marks come back at 60% or more (once per result). */
var KCHEER = {};
function kCheer(){
  var at=S.attempt, r=at&&at.result; if(S.view!=='student' || S.route.name!=='attempt' || !r || r.status==='pending' || !r.max || KCHEER[r.id]) return;
  KCHEER[r.id]=1; if(r.total/r.max<0.6) return;
  try{ if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return; }catch(e){}
  var box=document.createElement('div'), C=['#6C47FF','#FF6FAE','#22C59B','#FFB627','#3BA7FF','#FF6B6B']; box.className='kconf'; box.setAttribute('aria-hidden','true');
  for(var i=0;i<70;i++){ var c=document.createElement('i'); c.style.left=(Math.random()*100)+'%'; c.style.background=C[i%C.length]; c.style.animationDelay=(Math.random()*0.6)+'s'; c.style.setProperty('--dx',(Math.random()*160-80)+'px'); c.style.setProperty('--r',(Math.random()*900-450)+'deg'); box.appendChild(c); }
  document.body.appendChild(box); setTimeout(function(){ if(box.parentNode) box.parentNode.removeChild(box); }, 3400);
}
function render(){
  document.body.classList.toggle('stu', S.view==='student');
  drawBar();
  var app=$('#app'), r=S.route.name, html='';
  if(S.view==='teacher'){
    if(!S.dash) html=viewTeacherLoading();
    else if(r==='create') html=viewCreate();
    else if(r==='upload') html=viewUpload();
    else if(r==='editor') html=viewEditor();
    else if(r==='results') html=viewResults();
    else if(r==='review') html=viewReview();
    else if(r==='settings') html=viewSettings();
    else if(r==='attempt') html=viewAttempt();
    else html=viewTeacherHome();
  } else {
    if(r==='attempt') html=viewAttempt();
    else html=viewStudentHome();
  }
  app.innerHTML=html;
  if(r==='attempt' || r==='review') afterWorkRender();
  if(r==='editor') growAll();
  if(BOOT.bridge){ try{ window.parent.cmRoute(r); }catch(e){} }
  kCheer();
}

/* covers: one colour per passage, picked from its title */
var COVERS=['linear-gradient(135deg,#6D3FE0,#B44AD8)','linear-gradient(135deg,#1FA389,#46C6A0)','linear-gradient(135deg,#F08A24,#F6B740)','linear-gradient(135deg,#E0457B,#F07AA3)','linear-gradient(135deg,#2F7BE5,#5FA8F5)','linear-gradient(135deg,#7C4DDB,#4BA3E3)'];
function coverOf(p){ var t=String((p&&(p.title||p.passageTitle))||''), h=0; for(var i=0;i<t.length;i++) h=(h*31+t.charCodeAt(i))>>>0; return COVERS[h%COVERS.length]; }
function emojiOf(p){
  var g=String((p&&p.genre)||'')+' '+String((p&&p.title)||'');
  if(/letter|email/i.test(g)) return '✉️'; if(/report|news|article|information|factual|expos/i.test(g)) return '📰';
  if(/poem|poetry/i.test(g)) return '🎵'; if(/diary|journal|recount/i.test(g)) return '📔'; if(/science|animal|nature/i.test(g)) return '🔬';
  if(/kite|fly|sky/i.test(g)) return '🪁'; if(/sea|beach|boat/i.test(g)) return '🌊'; if(/food|cook|hawker/i.test(g)) return '🍜';
  return '📖';
}
function ringHTML(total, max, big){
  var pc=pct(total,max), c=pc>=75?'var(--mint)':pc>=50?'var(--sun)':'var(--rose)';
  return '<div class="ring'+(big?' big':'')+'" style="--p:'+pc+';--rc:'+c+'"><span>'+(big?fmtMarks(total)+'<small>/ '+fmtMarks(max)+'</small>':pc+'%')+'</span></div>';
}

  '<path d="M60 26v66" stroke="#C9BDF7" stroke-width="2"/><g stroke="#C9BDF7" stroke-width="3" stroke-linecap="round"><path d="M20 34h28M20 44h30M20 54h24M20 64h28M72 34h28M70 44h30M72 54h22M70 64h28"/></g>'+
  '<g fill="#FFD166"><path d="M98 2l3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/><path d="M16 0l2 4 4 2-4 2-2 4-2-4-4-2 4-2z" opacity=".85"/><circle cx="112" cy="40" r="3"/></g></svg>';
function viewStudentHome(){
  var s=S.student, first=s.name?esc(s.name.split(' ')[0]):'';
  var h='<div class="kid">';
  h+='<section class="khero"><div><div class="khi">👋 Hi'+(first?', '+first:'')+'!</div><h1>Ready to read?</h1>'+
     '<p>Read the passage, answer the questions, then learn from your marks. Stuck on a word? Tap it to see what it means.</p>'+
     '<div class="ksteps"><span>📖 Read</span><i>→</i><span>✏️ Answer</span><i>→</i><span>💡 Learn</span></div></div>'+HERO_ART+'</section>';

  if(S.loadErr) h+='<div class="err">'+esc(S.loadErr)+'</div>';
  if(!s.name) return h+'</div>';

  var res=S.results||[], done={}, best=null;
  res.forEach(function(r){ done[r.passageId]=1; if(r.status!=='pending' && r.max){ var pc=pct(r.total,r.max); if(best===null || pc>best) best=pc; } });
  var todo=(S.list||[]).filter(function(p){ return !p.closed && !done[p.id]; }).length;
  if(S.list) h+='<div class="kstats"><div style="--c:#8B6CF0"><b>'+todo+'</b><span>To do</span></div><div style="--c:#3FB8A0"><b>'+Object.keys(done).length+'</b><span>Handed in</span></div>'+
     '<div style="--c:#F2A93B"><b>'+(best===null?'–':best+'%')+'</b><span>Best score</span></div></div>';

  h+='<h2 class="ksec">📚 Your comprehensions</h2>';
  if(!S.list) h+='<div class="kempty"><span class="e">⏳</span>Loading passages…</div>';
  else if(!S.list.length) h+='<div class="kempty"><span class="e">🌈</span><b>Nothing set right now.</b>When your teacher sets a comprehension, it will be here.</div>';
  else {
    h+='<div class="kcards">'+S.list.map(function(p){
      var mine=res.filter(function(r){ return r.passageId===p.id; })[0];
      var draft=LS.get(draftKey(p.id),null);
      var status = mine ? (mine.status==='pending'?'<span class="pill part">Waiting for teacher</span>':'<span class="pill good">✓ Handed in · '+fmtMarks(mine.total)+' / '+fmtMarks(mine.max)+'</span>')
        : draft ? '<span class="pill pen">✏️ In progress</span>' : '<span class="pill" style="background:var(--sun-soft);color:#8A5A00">✨ New</span>';
      var btn = p.closed ? '' : '<button class="btn '+(mine?'':'go')+'" data-act="start" data-id="'+p.id+'">'+(mine?'↻ Try again':draft?'▶ Continue':'▶ Start reading')+'</button>';
      return '<article class="kcard"><div class="kcover" style="--g:'+coverOf(p)+'"><span class="kemo">'+emojiOf(p)+'</span><span class="klevel">'+esc(p.level)+(p.genre?' · '+esc(p.genre):'')+'</span></div>'+
        '<div class="kbody"><h3>'+esc(p.title)+'</h3><div class="meta"><span>'+p.questions+' questions · '+p.marks+' marks</span></div><div class="meta">'+duePill(p)+status+'</div>'+
        '<div class="kact">'+(mine?'<button class="btn go" data-act="openResult" data-id="'+mine.id+'">🏆 See marks</button>':'')+btn+
        (p.closed && !mine?'<span class="muted small">Closed. Speak to your teacher.</span>':'')+'</div></div></article>';
    }).join('')+'</div>';
  }

  if(res.length){
    h+='<h2 class="ksec">🏆 My results</h2><div class="kres">'+res.map(function(r){
      return '<div class="kr">'+(r.status==='pending'?'<div class="ring"><span>⏳</span></div>':ringHTML(r.total,r.max))+
        '<div><h3>'+esc(r.passageTitle)+'</h3><div class="meta"><span>Attempt '+(r.attempt||1)+'</span><span>'+when(r.submittedAt)+'</span>'+
        (r.status==='pending'?'<span class="pill part">Waiting for teacher</span>':'<span>'+fmtMarks(r.total)+' / '+fmtMarks(r.max)+'</span>')+(r.markedBy==='teacher'?'<span class="pill pen">Checked by teacher</span>':'')+'</div></div>'+
        '<button class="btn small" data-act="openResult" data-id="'+r.id+'">Review</button></div>';
    }).join('')+'</div>';
  }
  return h+'</div>';
}

function draftKey(pid){ return 'cpm.draft.'+pid+'.'+slug(S.student.cls+'-'+S.student.name); }

function loadStudent(){ S.loadErr=''; loadAssigned(); }
function loadStudentOld(){
  S.loadErr='';
  call('listClasses').then(function(c){
    S.classes=c;
    var s=S.student;
    if(s.name){
      var cur=c.filter(function(x){ return normCls(x.cls)===normCls(s.cls); })[0];
      if(!cur || cur.names.indexOf(s.name)<0){ S.student={name:'',cls:''}; LS.set('cpm.student',S.student); }
    }
    if(S.route.name==='home') render();
    if(S.student.name) loadAssigned();
  }).catch(function(e){ S.classes=[]; S.loadErr=e.message; render(); });
}
function loadAssigned(){
  var s=S.student;
  call('listPublished',{cls:s.cls}).then(function(l){ S.list=l; if(S.route.name==='home') render();
    if(BOOT.pid && !loadStudent.opened){ loadStudent.opened=true; startAttempt(BOOT.pid); }
  }).catch(function(e){ S.list=[]; S.loadErr=e.message; render(); });
  call('myResults',{student:s.name, cls:s.cls}).then(function(r){ S.results=r; if(S.route.name==='home') render(); }).catch(function(){});
}

function startAttempt(pid, preview){
  if(!preview && !S.student.name){ toast('Choose your class and name first.'); var n=$('#sCls'); if(n) n.focus(); return; }
  var get = preview ? Promise.resolve(preview) : call('getPassage',{id:pid, cls:S.student.cls});
  var b=busy('Opening passage',['Fetching the passage'],' ');
  get.then(function(p){
    b.done();
    var d = preview ? null : LS.get(draftKey(p.id),null);
    S.attempt = { passage:p, answers:(d&&d.answers)||{}, annos:(d&&d.annos)||[], words:(d&&d.words)||[], tab:'passage', showAi:true, result:null, preview:!!preview, clue:null, sel:null, sheet:null };
    S.route={name:'attempt'};
    render(); window.scrollTo(0,0);
  }).catch(function(e){ b.done(); toast(e.message); });
}

function openResult(id){
  var r=(S.results||[]).filter(function(x){ return x.id===id; })[0]; if(!r || !r.passage) return toast('That result is no longer available.');
  S.attempt={ passage:r.passage, answers:r.answers||{}, annos:r.annos||[], words:[], tab:'questions', showAi:true, result:r, preview:false, clue:null, sel:null, sheet:null };
  S.route={name:'attempt'}; render(); window.scrollTo(0,0);
}

var draftTimer;
function saveDraft(){
