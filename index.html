<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>Class pages</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cal+Sans&family=Manrope:wght@400..800&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<style>
body{margin:0;font-family:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;background:#F7F5FA;color:#1E1A32;display:grid;place-items:center;min-height:100vh;padding:24px;box-sizing:border-box;text-align:center}
.card{max-width:420px;background:#FDFAF3;border:2px solid #1E1A32;border-radius:26px;box-shadow:4px 5px 0 #1E1A32;overflow:hidden}
.top{background:#5D1E56;color:#FDFAF3;padding:26px 22px 20px;border-bottom:2px solid #1E1A32}
.mark{width:64px;height:64px;margin:0 auto 10px;border-radius:50%;background:#FFE995;border:2px solid #1E1A32;box-shadow:2px 3px 0 #1E1A32;display:grid;place-items:center}
.mark svg{width:30px;height:30px;fill:#5D1E56}
h1{font-family:"Cal Sans",Manrope,sans-serif;font-weight:400;font-size:30px;margin:0}
p{margin:0;padding:20px 22px 24px;line-height:1.55;font-size:16px;color:#3A3450}
</style></head>
<body><div class="card"><div class="top"><div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.5 1.3 6.5L12 17.1l-5.9 3.2 1.3-6.5L2.5 9.3l6.6-.8z"/></svg></div><h1>Class pages</h1></div>
<p>Please scan the QR code on your Class Hub slip or on a class library book.</p></div></body></html>
