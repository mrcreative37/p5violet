<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Instrument+Sans:wght@400..700&family=Nothing+You+Could+Do&display=swap" rel="stylesheet">
<style>
  /* ===== Our class scrapbook: violet paper, sticker colours, washi tape, the class stamp ===== */
  :root {
    --paper:#F3F0FD; --dot:#DCD4F7; --card:#FFFFFF; --ink:#1E1735; --muted:#635C82; --line:#E4DEF6;
    --violet:#2E1A78; --violet-2:#5B3FD6; --lilac:#ECE7FF; --gold:#F2AE00; --gold-ink:#7A5200;
    --ok:#12805C; --ok-soft:#E2F4EC; --danger:#C43A3A; --danger-soft:#FDECEC; --warn:#8A5A00; --warn-soft:#FFF3D1;
    --head:'Bricolage Grotesque','Instrument Sans',system-ui,sans-serif; --hand:'Nothing You Could Do','Segoe Print',cursive;
    --s1:#FFE58F; --s2:#C9F2E1; --s3:#FFD3C2; --s4:#CFE3FF; --s5:#F9D1EC; --s6:#E1D8FF;   /* sticky-note colours */
    --dock:88px;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; color:var(--ink); font-family:'Instrument Sans',-apple-system,"Segoe UI",Roboto,Arial,sans-serif; -webkit-text-size-adjust:100%; -webkit-font-smoothing:antialiased; }
  body { background:var(--paper) radial-gradient(var(--dot) 1.2px, transparent 1.4px) 0 0/22px 22px; min-height:100vh; }
  button, input, textarea { font:inherit; color:inherit; }
  button { cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .hidden { display:none !important; }
  .wrap { max-width:820px; margin:0 auto; padding:0 16px calc(var(--dock) + 40px); }
  h1, h2, h3, h4 { font-family:var(--head); letter-spacing:-.02em; }

  /* ---------- Top bar ---------- */
  .top { position:sticky; top:0; z-index:20; color:#fff; background:radial-gradient(130% 180% at 100% 0%, #4A2BB8 0%, var(--violet) 52%, #21115C 100%); box-shadow:0 6px 24px rgba(46,26,120,.18); }
  .top-in { max-width:820px; margin:0 auto; padding:10px 16px; display:flex; align-items:center; gap:12px; }
  .logo { width:40px; height:40px; flex:none; }
  .top small { display:block; color:#C9BEF7; font-weight:700; font-size:12.5px; }
  .top b { font-family:var(--head); font-size:20px; letter-spacing:-.02em; display:block; line-height:1.1; }
  .mepill { margin-left:auto; display:flex; align-items:center; gap:8px; background:rgba(255,255,255,.12); border:1.5px solid rgba(255,255,255,.22); color:#fff; border-radius:999px; padding:4px 12px 4px 4px; font-weight:700; font-size:14px; min-height:44px; }
  .ttl { min-width:0; } .ttl b, .ttl small { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .mepill { flex:none; cursor:pointer; }
  .mepill .so { display:flex; align-items:center; gap:5px; margin-left:2px; padding:6px 10px; border-radius:999px; background:rgba(255,255,255,.16); font-size:13px; font-weight:800; }
  .mepill .so svg { width:16px; height:16px; }
  @media (max-width:440px) { .mepill .nm { display:none; } .mepill { padding-right:4px; } .top b { font-size:18px; } }
  .bye { text-align:center; padding:6px 0 4px; }
  .bye .av { width:72px; height:72px; font-size:24px; margin:0 auto 10px; }
  .bye .btn { width:100%; margin-top:10px; }
  .av { width:34px; height:34px; border-radius:50%; display:grid; place-items:center; font:800 13px/1 var(--head); color:var(--ink); flex:none; box-shadow:inset 0 0 0 2px rgba(255,255,255,.7); }

  /* ---------- Bottom dock ---------- */
  .tabs { position:fixed; left:12px; right:12px; bottom:calc(10px + env(safe-area-inset-bottom,0px)); z-index:25; max-width:520px; margin:0 auto;
    background:rgba(255,255,255,.9); -webkit-backdrop-filter:saturate(1.4) blur(16px); backdrop-filter:saturate(1.4) blur(16px);
    border:1px solid var(--line); border-radius:26px; padding:6px; box-shadow:0 12px 32px rgba(46,26,120,.18); }
  .tabs-in { display:grid; grid-template-columns:repeat(3,1fr); gap:4px; }
  .tabs.t5 { max-width:600px; } .tabs.t5 button { font-size:11.5px; } .tabs.t6 { max-width:640px; } .tabs.t6 .tabs-in { gap:2px; } .tabs.t6 button { font-size:10.5px; letter-spacing:-.01em; } .tabs.t6 svg { width:22px; height:22px; } .tabs .dot.gold { background:var(--gold); color:#3A2600; }
  .tabs button { border:0; background:none; padding:7px 0 6px; display:flex; flex-direction:column; align-items:center; gap:3px; font-size:12.5px; font-weight:700; color:var(--muted); border-radius:20px; position:relative; min-height:56px; transition:background .18s, color .18s; }
  .tabs svg { width:24px; height:24px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .tabs button.on { color:#fff; background:var(--violet-2); box-shadow:0 6px 16px rgba(91,63,214,.35); }
  .dot { position:absolute; top:3px; left:calc(50% + 8px); background:var(--danger); color:#fff; font-size:11px; font-weight:800; border-radius:999px; min-width:20px; height:20px; padding:0 6px; display:flex; align-items:center; justify-content:center; box-shadow:0 0 0 2px #fff; }

  /* ---------- Common ---------- */
  .card { background:var(--card); border:1px solid var(--line); border-radius:22px; padding:18px; margin-top:16px; box-shadow:0 2px 0 rgba(46,26,120,.04), 0 10px 26px rgba(46,26,120,.06); }
  .muted { color:var(--muted); font-size:14.5px; line-height:1.5; }
  .btn { border:0; border-radius:16px; padding:12px 18px; font-weight:700; min-height:50px; font-size:16px; display:inline-flex; align-items:center; justify-content:center; gap:8px; transition:transform .1s; }
  .btn:active:not(:disabled) { transform:scale(.97); }
  .primary { background:linear-gradient(135deg, #6B4DF0, var(--violet-2) 45%, #4527B8); color:#fff; box-shadow:0 8px 20px rgba(91,63,214,.32); }
  .soft { background:var(--lilac); color:var(--violet); } .danger { background:var(--danger-soft); color:var(--danger); }
  .btn:disabled { opacity:.5; cursor:default; box-shadow:none; }
  .big { width:100%; font-size:18px; min-height:58px; }
  .msg { border-radius:16px; padding:14px 16px; font-weight:700; line-height:1.4; margin-top:14px; }
  .msg.ok { background:var(--ok-soft); color:var(--ok); } .msg.err { background:var(--danger-soft); color:var(--danger); }
  .spin { display:flex; justify-content:center; padding:56px 0; }
  .spin i { width:12px; height:12px; margin:0 5px; border-radius:50%; background:var(--violet-2); animation:hop 1s infinite ease-in-out; }
  .spin i:nth-child(2) { animation-delay:.15s; background:var(--gold); } .spin i:nth-child(3) { animation-delay:.3s; background:#2BB57F; }
  @keyframes hop { 0%,80%,100% { transform:translateY(0); opacity:.5; } 40% { transform:translateY(-10px); opacity:1; } }
  .empty { text-align:center; padding:44px 20px; color:var(--muted); }
  .empty .e { font-size:52px; display:block; margin-bottom:6px; }
  .empty .hand { font-family:var(--hand); font-size:24px; color:var(--violet); display:block; margin-bottom:4px; }
  label.lbl { display:block; font-weight:700; margin:14px 0 6px; }
  .input { width:100%; border:2px solid var(--line); border-radius:16px; padding:12px 14px; font-size:16px; min-height:52px; background:#fff; }
  .input:focus { outline:none; border-color:var(--violet-2); box-shadow:0 0 0 4px var(--lilac); }
  textarea.input { resize:vertical; min-height:120px; line-height:1.45; }
  .hand { font-family:var(--hand); font-weight:400; }
  :focus-visible { outline:3px solid var(--violet-2); outline-offset:2px; }

  /* ---------- Sign in ---------- */
  .hello { text-align:center; padding:26px 0 4px; }
  .hello .hand { font-size:28px; color:var(--violet-2); display:block; transform:rotate(-3deg); }
  .hello h1 { margin:2px 0 6px; font-size:34px; line-height:1.05; }
  .names { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin-top:14px; }
  @media (min-width:600px) { .names { grid-template-columns:repeat(3,minmax(0,1fr)); } }
  .name { border:1.5px solid var(--line); background:#fff; border-radius:18px; padding:10px; min-height:62px; text-align:left; font-size:15px; font-weight:700; display:flex; align-items:center; gap:10px; line-height:1.2; box-shadow:0 3px 0 var(--line); transition:transform .1s; }
  .name:active { transform:translateY(2px); box-shadow:0 1px 0 var(--line); }
  .name .av { width:38px; height:38px; font-size:14px; }
  .pinwrap { text-align:center; padding-top:22px; }
  .pinwrap .av { width:84px; height:84px; font-size:30px; margin:0 auto; box-shadow:0 0 0 5px #fff, 0 10px 24px rgba(46,26,120,.2); }
  .pin-dots { display:flex; justify-content:center; gap:14px; margin:20px 0 6px; }
  .pin-dots i { width:34px; height:34px; display:grid; place-items:center; font-style:normal; font-size:26px; color:var(--dot); transition:transform .15s, color .15s; }
  .pin-dots i:before { content:"★"; }
  .pin-dots i.on { color:var(--gold); transform:scale(1.15) rotate(-8deg); }
  .shake { animation:shake .4s; } @keyframes shake { 20%,60% { transform:translateX(-9px); } 40%,80% { transform:translateX(9px); } }
  .pad { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; max-width:320px; margin:16px auto 0; }
  .pad button { border:0; background:#fff; color:var(--violet); font:800 28px/1 var(--head); border-radius:22px; min-height:66px; box-shadow:0 4px 0 var(--line), 0 6px 14px rgba(46,26,120,.06); transition:transform .08s; }
  .pad button:active { transform:translateY(3px); box-shadow:0 1px 0 var(--line); }
  .pad button.ghost { background:none; box-shadow:none; font:700 15px/1.2 'Instrument Sans',sans-serif; color:var(--muted); }

  /* ---------- Wall ---------- */
  .chips { display:flex; gap:8px; overflow-x:auto; padding:16px 2px 4px; margin:0 -16px; padding-left:16px; padding-right:16px; scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  .chip { flex:0 0 auto; border:1.5px solid var(--line); background:#fff; border-radius:999px; padding:10px 16px; font-weight:700; font-size:15px; min-height:46px; white-space:nowrap; box-shadow:0 2px 0 var(--line); }
  .chip.on { background:var(--violet); border-color:var(--violet); color:#fff; box-shadow:0 6px 14px rgba(46,26,120,.25); }
  .board { position:relative; background:#fff; border-radius:22px; padding:26px 20px 20px; margin-top:20px; border:1px solid var(--line); box-shadow:0 10px 26px rgba(46,26,120,.07); }
  .tape { position:absolute; top:-12px; left:50%; width:110px; height:26px; transform:translateX(-50%) rotate(-3deg); background:rgba(242,174,0,.38); border-left:2px dotted rgba(255,255,255,.6); border-right:2px dotted rgba(255,255,255,.6); }
  .board h2 { margin:0 0 6px; font-size:26px; line-height:1.1; }
  .board .prompt { font-size:16px; line-height:1.5; white-space:pre-wrap; }
  .tags { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  .tag { font-size:13px; font-weight:700; border-radius:999px; padding:5px 11px; background:var(--lilac); color:var(--violet); }
  .tag.gold { background:var(--warn-soft); color:var(--gold-ink); } .tag.grey { background:#EEEEF3; color:var(--muted); }
  .grid { columns:2 180px; column-gap:14px; margin-top:22px; }
  @media (min-width:700px) { .grid { columns:3 200px; } }
  .post { position:relative; break-inside:avoid; border:0; border-radius:6px 6px 16px 16px; margin:0 0 18px; width:100%; text-align:left; padding:10px 10px 12px; display:block;
    background:#fff; box-shadow:0 2px 0 rgba(30,23,53,.05), 0 10px 22px rgba(46,26,120,.10); transform:rotate(var(--r,0deg)); transition:transform .15s; animation:pop .45s both cubic-bezier(.2,.9,.3,1.2); }
  .post:active { transform:rotate(0deg) scale(.98); }
  .post:before { content:""; position:absolute; top:-9px; left:50%; width:62px; height:20px; transform:translateX(-50%) rotate(var(--tr,-4deg)); background:var(--tape,rgba(91,63,214,.25)); z-index:1; }
  .post.note { background:var(--bgc,var(--s1)); padding:16px 14px 12px; border-radius:4px 4px 16px 4px; }
  @keyframes pop { from { opacity:0; transform:translateY(14px) rotate(var(--r,0deg)) scale(.96); } }
  .post .phbox { border-radius:4px; overflow:hidden; background:var(--lilac); }
  .post .ph { width:100%; aspect-ratio:4/3; display:block; object-fit:cover; opacity:0; transition:opacity .35s; }
  .post .ph.in { opacity:1; } .post .ph.loaded { aspect-ratio:auto; }
  .post .body { padding:10px 4px 0; }
  .post.note .body { padding:0; }
  .post .txt { font-size:15.5px; line-height:1.45; white-space:pre-wrap; word-wrap:break-word; display:-webkit-box; -webkit-line-clamp:8; -webkit-box-orient:vertical; overflow:hidden; }
  .post .who { margin-top:10px; display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); }
  .post .who .av { width:26px; height:26px; font-size:10.5px; }
  .post .who b { color:var(--ink); font-size:13.5px; }
  .post .who span { margin-left:auto; white-space:nowrap; }
  .post.pending.note .txt { padding-right:78px; }
  .post.pending { outline:2.5px dashed #B7AEE0; outline-offset:-2px; }
  .post.hidden-post { outline:2.5px dashed #F0B4AE; outline-offset:-2px; }
  .stampwait { position:absolute; top:14px; right:10px; z-index:2; font:800 11px/1 var(--head); letter-spacing:.08em; color:#B9354B; border:2px solid #B9354B; border-radius:8px; padding:5px 7px; transform:rotate(8deg); background:rgba(255,255,255,.75); }
  .rx { display:flex; flex-wrap:wrap; gap:6px; margin-top:9px; font-size:13px; }
  .rx span { background:rgba(255,255,255,.75); border:1px solid rgba(30,23,53,.08); border-radius:999px; padding:3px 9px; font-weight:700; }
  .linkchip { display:inline-flex; align-items:center; gap:6px; margin-top:8px; font-size:14px; font-weight:700; color:var(--violet-2); word-break:break-all; }
  .state { font-size:12px; font-weight:800; border-radius:8px; padding:4px 8px; display:inline-block; margin-bottom:6px; }
  .state.no { background:var(--danger-soft); color:var(--danger); }
  .fbbox { margin-top:10px; background:rgba(255,255,255,.85); border:1.5px solid #D9CFFF; border-radius:14px; padding:9px 11px; font-size:14px; line-height:1.45; white-space:pre-wrap; word-wrap:break-word; }
  .fbbox b { display:block; font-family:var(--hand); font-weight:400; font-size:17px; color:var(--violet-2); margin-bottom:1px; }
  .ilc { margin-top:10px; display:flex; flex-direction:column; gap:6px; }
  .ilc .fbbox { margin-top:0; }
  .ilc-c { background:rgba(255,255,255,.7); border-radius:12px; padding:7px 11px; font-size:14px; line-height:1.4; white-space:pre-wrap; word-wrap:break-word; }
  .ilc-c b { display:block; font-size:12px; color:var(--ink); }
  .ilc-more { font-size:13px; font-weight:700; color:var(--violet-2); padding:2px 2px 0; }


  /* ---------- Teacher's preview ---------- */
  .pvbar { background:linear-gradient(90deg,#FFF3D1,#FFE7A8); color:#5A3C00; border-bottom:1px solid #F2D58A; font-weight:700; font-size:13.5px; padding:7px 14px; line-height:1.3; display:flex; align-items:center; gap:8px; justify-content:center; }
  .pvbar b { color:#3A2600; display:inline; font:inherit; font-weight:800; letter-spacing:0; }
  .pvbar span { min-width:0; }
  .pvback { border:0; background:#3A2600; color:#FFE7A8; font-weight:800; font-size:13px; border-radius:999px; padding:6px 12px; cursor:pointer; flex:none; }

  /* ---------- Spotlight & Birthdays ---------- */
  .cheer-hero { padding:22px 2px 6px; } .cheer-hero h1 { margin:0; font-size:30px; line-height:1.1; } .cheer-hero .hand { font-size:21px; color:var(--violet-2); }
  .cheer-hero p { margin:6px 0 0; color:var(--muted); font-size:15px; }
  .cheer { position:relative; background:#fff; border-radius:22px; padding:18px 16px 14px; margin:22px 0 0; box-shadow:0 2px 0 rgba(30,23,53,.05), 0 14px 30px rgba(46,26,120,.10); animation:pop .45s both cubic-bezier(.2,.9,.3,1.2); }
  .cheer.spot { background:linear-gradient(180deg,#FFFBEA 0,#fff 120px); border:1.5px solid #F6E2A3; }
  .cheer.spot:before { content:"★ SPOTLIGHT ★"; position:absolute; top:-12px; left:50%; transform:translateX(-50%) rotate(-2deg); background:var(--gold); color:#3A2600; font:800 11.5px/1 var(--head); letter-spacing:.12em; padding:7px 12px; border-radius:8px; box-shadow:0 4px 10px rgba(242,174,0,.35); white-space:nowrap; }
  .cheer-top { display:flex; gap:14px; align-items:center; }
  .pframe { position:relative; flex:none; width:84px; height:84px; border-radius:50%; overflow:hidden; background:var(--lilac); box-shadow:0 0 0 4px #fff, 0 0 0 6px var(--gold), 0 8px 18px rgba(46,26,120,.18); display:grid; place-items:center; }
  .pframe img { width:100%; height:100%; object-fit:cover; display:block; opacity:0; transition:opacity .35s; position:absolute; inset:0; }
  .pframe img.in { opacity:1; }
  .pframe .av { width:100%; height:100%; font-size:28px; box-shadow:none; }
  .cheer h2 { margin:0; font-size:23px; line-height:1.15; }
  .cheer .from { margin:3px 0 0; font-size:13.5px; color:var(--muted); font-weight:600; }
  .cheer .from .hand { font-size:18px; color:var(--violet-2); font-weight:400; }
  .cheer .quote { margin:14px 0 0; font-size:16.5px; line-height:1.55; white-space:pre-wrap; word-wrap:break-word; background:#fff; border-left:4px solid var(--gold); border-radius:4px 14px 14px 4px; padding:10px 14px; }
  .cheer .meyou { margin:12px 0 0; background:var(--lilac); color:var(--violet); border-radius:14px; padding:10px 14px; font-weight:700; font-size:15px; }
  .wcount { display:flex; align-items:center; gap:8px; margin:14px 0 4px; font-weight:800; font-size:14px; color:var(--violet); }
  .wishes { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; margin-top:8px; }
  .wish { position:relative; background:var(--bgc,#FFE58F); border-radius:4px 4px 14px 4px; padding:10px 11px 9px; font-size:14.5px; line-height:1.4; transform:rotate(var(--r,0deg)); box-shadow:0 6px 14px rgba(46,26,120,.10); word-wrap:break-word; }
  .wish b { display:block; font-family:var(--hand); font-weight:400; font-size:17px; color:var(--violet); margin-top:4px; }
  .wish.teacher { background:#fff; border:1.5px solid #D9CFFF; }
  .wish.can-rm { padding-right:34px; }
  .wish .rm { position:absolute; top:4px; right:4px; border:0; background:rgba(255,255,255,.7); border-radius:999px; width:28px; height:28px; font-size:14px; color:var(--muted); }
  .wmore { margin-top:10px; border:0; background:none; color:var(--violet-2); font-weight:800; font-size:14px; padding:6px 2px; }
  .wbox { margin-top:14px; border-top:1.5px dashed var(--line); padding-top:12px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
  .chips button { border:1.5px solid var(--line); background:#fff; border-radius:999px; padding:7px 12px; font-size:14px; font-weight:700; color:var(--violet); min-height:38px; }
  .chips button:active { background:var(--lilac); }
  .wrow { display:flex; gap:8px; } .wrow input { flex:1; min-width:0; }
  .wrow .btn { min-height:48px; padding:10px 16px; }
  .wdone { margin-top:12px; font-weight:700; color:var(--ok); font-size:14.5px; }
  .wsoon { margin-top:12px; color:var(--muted); font-size:14px; font-weight:600; }
  /* Birthdays */
  .cheer.bday-today { background:linear-gradient(160deg,#FFF0F6 0,#F1ECFF 55%,#FFF8E1 100%); border:1.5px solid #F4C9E0; padding-top:24px; overflow:hidden; }
  .confetti { position:absolute; inset:0; pointer-events:none; opacity:.9; background-image:
    radial-gradient(circle at 8% 12%,#F2AE00 3px,transparent 4px), radial-gradient(circle at 22% 6%,#FF6FAE 3px,transparent 4px), radial-gradient(circle at 78% 9%,#5B3FD6 3px,transparent 4px),
    radial-gradient(circle at 92% 18%,#2BB57F 3px,transparent 4px), radial-gradient(circle at 60% 4%,#FF8A3D 2.5px,transparent 3.5px), radial-gradient(circle at 40% 14%,#4FA9FF 2.5px,transparent 3.5px); }
  .bday-big { text-align:center; position:relative; }
  .bday-big .pframe { width:150px; height:150px; margin:4px auto 0; border-radius:10px; transform:rotate(-3deg); box-shadow:0 0 0 8px #fff, 0 14px 30px rgba(46,26,120,.22); }
  .bday-big .pframe .av { font-size:46px; border-radius:0; }
  .bday-big .tape { position:absolute; top:-6px; left:50%; width:90px; height:22px; transform:translateX(-50%) rotate(4deg); background:rgba(255,111,174,.4); z-index:2; }
  .bday-big .hb { font-family:var(--hand); font-size:34px; line-height:1.1; color:var(--violet); margin:22px 0 0; }
  .bday-big h2 { font-size:28px; margin:2px 0 0; }
  .bday-big .from { text-align:center; }

/* Student page address: this page talks to the class script in the background with NO Google
   sign-in (credentials: "omit"), so it works on any phone, however many Google accounts it has. */
(function() {
  var API = "https://script.google.com/macros/s/AKfycby9Sq43RK3aB35fzOLYD9ZC8zbDZPN-VbF0tG_79UZpm9u9rCGtRyDOf1H9FojHE1Gb/exec";
  var useGet = false;                       // set if this browser refuses the normal (POST) request
  function call(fn, args, ok, fail, tries) {
    var body = JSON.stringify({ fn: fn, args: args }), viaGet = useGet && body.length < 1800;
    (viaGet ? fetch(API + "?api=1&q=" + encodeURIComponent(body), { credentials: "omit", redirect: "follow", cache: "no-store" })
            : fetch(API + "?api=1", { method: "POST", body: body, credentials: "omit", redirect: "follow", cache: "no-store" }))
      .then(function(r) { return r.text(); })
      .then(function(t) {
        var d; try { d = JSON.parse(t); } catch (e) { throw new Error("The class server is busy. Please try again in a moment."); }
        if (d.ok) ok(d.result); else fail(new Error(d.error || "Something went wrong. Please try again."));
      })
      .catch(function(e) {
        if ((tries || 0) < 1 && /fetch|network|load failed/i.test(String(e && e.message))) { useGet = true; return setTimeout(function() { call(fn, args, ok, fail, 1); }, 600); }
        fail(e && /class server|try again/i.test(e.message) ? e : new Error("Can't reach the class server. Check the internet connection and try again."));
      });
  }
  function runner() {
    var ok = function() {}, fail = function(e) { console.error(e); }, p;
    p = new Proxy({}, { get: function(t, k) {

      if (k === "withFailureHandler") return function(f) { fail = f; return p; };
      if (k === "withUserObject") return function() { return p; };
      return function() { call(String(k), Array.prototype.slice.call(arguments), ok, fail); };
    } });
    return p;
  }
  window.google = { script: { get run() { return runner(); } } };
  window.urlParam = function(n) { var m = new RegExp("[?&]" + n + "=([^&#]*)").exec(location.search); return m ? decodeURIComponent(m[1].replace(/\+/g, " ")).replace(/[^A-Za-z0-9]/g, "") : ""; };

<script>
var MODE = "hub", HUB_KEY = urlParam("k"), DASH_KEY = "", CLASS_NAME = "";

/** Each student gets their own sticker colour (the same every time). */

/** Shrinks a photo on the device before upload (fast, small, and strips location data). */
function shrink(file, max, q) {
  return new Promise(function(resolve, reject) {
    var url = URL.createObjectURL(file), img = new Image();

      var w = img.naturalWidth, h = img.naturalHeight, s = Math.min(1, max / Math.max(w, h));

// ================= Fast pictures =================
// Pictures arrive a dozen at a time, at most two requests at once (big ones get their own lane), are turned into
// light-weight picture links once, and are remembered while the page is open. Each one fades in when it's ready.
// Sizes: t = album grid (small and quick), s = lists and cards, m / l = one photo full screen (m on phones, l on big screens).
var IMGQ = { t: [], s: [], m: [], l: [], busy: { t: 0, s: 0, m: 0, l: 0 }, wait: {} };

  if (!dataUrl || !window.fetch || !window.URL || !URL.createObjectURL) return Promise.resolve(dataUrl);
  return fetch(dataUrl).then(function(r) { return r.blob(); }).then(function(b) { return URL.createObjectURL(b); }).catch(function() { return dataUrl; });

/** Ask for pictures. fn/extra = which server function (wall, or an album); size t / s / m / l (see above). */
function wantImgs(ids, size, fn, extra) {
  size = imgSize(size);
  ids.forEach(function(id) {
    if (!id || S.imgs[size + id] || IMGQ.wait[size + id]) return;
    IMGQ.wait[size + id] = 1; IMGQ[size].push({ id: id, fn: fn || "hubImages", extra: extra || [] });

      (keep ? imgDbGet(ids.map(function(id) { return size + id; })) : Promise.resolve({})).then(function(have) {
        var need = ids.filter(function(id) { return !have[size + id]; });
        return Promise.all(ids.filter(function(id) { return have[size + id]; }).map(function(id) {   // pictures already kept on this device: no trip
          return toUrl(have[size + id]).then(function(u) { S.imgs[size + id] = u; delete IMGQ.wait[size + id]; paintImgs(id, size); });
        })).then(function() {

    call("hubReact", p.id, b.getAttribute("data-rx")).then(function(np) {
      np.thumb = p.thumb; for (var k in np) p[k] = np[k]; drawRx(p); refreshCard(p);
    }).catch(function(e) { b.disabled = false; flash(e.message, true, $("sheetBody")); });
  };
}
function refreshCard(p) {
  var old = document.querySelector('#grid [data-post="' + p.id + '"]'); if (!old) return;
  var i = Array.prototype.indexOf.call(old.parentNode.children, old);
  var tmp = document.createElement("div"); tmp.innerHTML = postCard(p, i); tmp.firstChild.style.animation = "none"; old.parentNode.replaceChild(tmp.firstChild, old); loadImages($("grid"));
}
function drawComments(list) {
  list = list.slice().sort(function(a, b) { return (b.teacher ? 1 : 0) - (a.teacher ? 1 : 0); });
  $("cms").innerHTML = list.length ? list.map(function(c) { return '<div class="cm' + (c.teacher ? ' teacher' : '') + '"><b>' + (c.teacher ? '✍️ ' : '') + esc(c.mine ? "You" : c.student) + '</b><time>' + ago(c.when) + '</time><div style="white-space:pre-wrap;word-wrap:break-word">' + esc(c.text) + '</div></div>'; }).join("")
    : '<div class="muted">No comments yet.</div>';
}

// ---------------- Ask your teacher ----------------
function renderAsk() {
  var t = S.home.teacher;
  $("topTitle").textContent = "Ask " + t;
  setDot(0);
  $("app").innerHTML = '<div class="askhead">' + avatar(t).replace('style="background:' + STICK[hue(t)] + '"', "") + '<div><h2>Ask ' + esc(t) + '</h2><p>Only you and ' + esc(t) + ' can see this chat. For anything urgent, tell a teacher straight away.</p></div></div>' +
    '<div class="chat" id="chat" aria-live="polite">' + SPIN + '</div>' +
    '<div class="composer" id="composer"><div class="attach hidden" id="attach"></div><div class="composer-in">' +
    '<button class="ibtn soft" id="aPhoto" aria-label="Add a photo">📷</button>' +
    '<textarea id="aText" rows="1" maxlength="800" placeholder="Type your message…" aria-label="Your message"></textarea>' +
    '<button class="ibtn primary" id="aSend" aria-label="Send">➤</button></div></div>';
  var ta = $("aText");
  ta.oninput = function() { this.style.height = "auto"; this.style.height = Math.min(140, this.scrollHeight) + "px"; };
  $("aPhoto").onclick = function() {
    pickPhoto(function(p) {
      S.askPhoto = p;
      $("attach").innerHTML = '<img alt="" src="' + p.thumb + '"><span>Photo added</span><button class="btn soft" id="aRm" style="min-height:40px;padding:6px 12px">Remove</button>';
      $("attach").classList.remove("hidden");
      $("aRm").onclick = function() { S.askPhoto = null; $("attach").classList.add("hidden"); };
    });
  };
  $("aSend").onclick = sendAsk;
  S.msgVer = ""; loadMsgs(false);
}
function loadMsgs(quiet) {
  call("hubMessages", S.msgVer).then(function(r) {
    if (S.tab !== "ask" || !$("chat")) return;
    if (r.same && quiet) return;
    S.msgVer = r.ver; if (!r.same) S.msgs = r.msgs; drawChat();
  }).catch(function(e) { if (!quiet && $("chat")) $("chat").innerHTML = '<div class="msg err">' + esc(e.message) + '</div>'; });
}
function drawChat() {
  var el = $("chat"); if (!el) return;
  var last = "";
  el.innerHTML = S.msgs.length ? S.msgs.map(function(m) {
    var d = dayLabel(m.when), head = d !== last ? '<div class="day">' + esc(d) + '</div>' : ""; last = d;
    return head + '<div class="bub ' + (m.from === "me" ? "me" : "them") + '">' + (m.photo ? '<img alt="Photo" data-img="' + esc(m.photo) + '">' : "") + esc(m.text) + '<time>' + clock(m.when) + '</time></div>';
  }).join("") : '<div class="empty"><span class="e">👋</span><span class="hand">Say hello!</span>Ask ' + esc(S.home.teacher) + ' anything about your work.</div>';
  loadImages(el);
  window.scrollTo(0, document.body.scrollHeight);
  setTimeout(function() { if (S.tab === "ask") window.scrollTo(0, document.body.scrollHeight); }, 700);
}
function sendAsk() {
  var t = $("aText").value.trim(), ph = S.askPhoto;
  if (!t && !ph) { $("aText").focus(); return; }
  var done = busy($("aSend"), "…");
  call("hubSend", t, ph ? ph.photo : "").then(function(r) {
    done(); $("aText").value = ""; $("aText").style.height = ""; S.askPhoto = null; $("attach").classList.add("hidden");
    S.msgVer = r.ver; S.msgs = r.msgs; drawChat();
    if (r.msg) flash(r.msg, false);
  }).catch(function(e) { done(); flash(e.message, true); window.scrollTo(0, 0); });
}

// ---------------- Photo gallery ----------------
/** The album list arrives with its cover pictures (one trip). */
function gotAlbums(list) {
  S.albums = list;
  return Promise.all(list.map(function(a) {
    if (!a.coverData || S.imgs["s" + a.cover]) return null;
    return toUrl(a.coverData).then(function(u) { S.imgs["s" + a.cover] = u; });
  })).then(function() { return list; });
}
function renderPhotos() {
  $("topTitle").textContent = "Photos";
  if (S.album) return renderAlbum();
  $("app").innerHTML = SPIN;
  var p = S.albums ? Promise.resolve(S.albums) : call("hubAlbums").then(gotAlbums);
  p.then(function(list) {
    if (S.tab !== "photos" || S.album) return;
    $("app").innerHTML = list.length ? '<div class="ph-hero"><span class="hand">Our memories</span><h1>Class photos</h1></div><div class="albums" id="albums">' + list.map(function(a, i) {
      return '<button class="album" data-al="' + esc(a.id) + '" style="--r:' + [-2, 1.5, -1, 2, -1.5, 1][i % 6] + 'deg"><div class="stack"><div class="pol"><img class="cv" alt="" data-img="' + esc(a.cover) + '"></div></div>' +
        '<b>' + esc(a.name) + '</b><small>' + a.count + ' photo' + (a.count === 1 ? "" : "s") + '</small></button>';
    }).join("") + '</div>' : '<div class="empty"><span class="e">🖼️</span><span class="hand">No photos yet</span>' + esc(S.home.teacher) + ' will add class photos here.</div>';
    var al = $("albums");
    if (al) {
      al.onclick = function(e) { var b = e.target.closest("[data-al]"); if (!b) return; openAlbum(b.getAttribute("data-al")); };
      paintImgs(null, "s");
      list.forEach(function(a) { if (a.cover && !S.imgs["s" + a.cover]) wantImgs([a.cover], "s", "hubGalleryImages", [a.id]); });
    }
  }).catch(function(e) { $("app").innerHTML = '<div class="msg err">' + esc(e.message) + '</div>'; });
}
function openAlbum(id) {
  var known = (S.albums || []).filter(function(a) { return a.id === id; })[0];
  $("app").innerHTML = '<div class="albhead"><button class="btn soft" id="back">‹ Albums</button><h2>' + esc(known ? known.name : "") + '</h2></div>' + SPIN;
  $("back").onclick = function() { S.album = null; renderPhotos(); };
  call("hubAlbum", id).then(function(a) {
    S.album = a;
    var first = a.first || {}, fs = a.firstSize || "s";
    return Promise.all(Object.keys(first).map(function(pid) { return first[pid] && !S.imgs[fs + pid] ? toUrl(first[pid]).then(function(u) { S.imgs[fs + pid] = u; }) : null; }));
  }).then(function() { if (S.album && S.tab === "photos") renderAlbum(); })
    .catch(function(e) { $("app").innerHTML = '<div class="msg err">' + esc(e.message) + '</div>'; });
}
function renderAlbum() {
  var a = S.album;
  $("app").innerHTML = '<div class="albhead"><button class="btn soft" id="back">‹ Albums</button><h2>' + esc(a.name) + '</h2><span class="count">' + a.photos.length + '</span>' +
    (a.photos.length > 1 ? '<button class="btn primary" id="play">▶ Slideshow</button>' : '') + '</div>' +
    '<div class="thumbs" id="thumbs">' + a.photos.map(function(id, i) { return '<button data-i="' + i + '" aria-label="Photo ' + (i + 1) + '"><img alt="" data-size="t" data-img="' + esc(id) + '"></button>'; }).join("") + '</div>';
  $("back").onclick = function() { S.album = null; renderPhotos(); };
  if ($("play")) $("play").onclick = function() { openViewer(0, true); };
  $("thumbs").onclick = function(e) { var b = e.target.closest("[data-i]"); if (b) openViewer(Number(b.getAttribute("data-i"))); };
  paintImgs(null, "t");
  var grid = $("thumbs");
  var io = "IntersectionObserver" in window ? new IntersectionObserver(function(entries) {
    var ids = [];
    entries.forEach(function(en) { if (!en.isIntersecting) return; var img = en.target.querySelector("img"), id = img && img.getAttribute("data-img"); if (id) ids.push(id); io.unobserve(en.target); });
    if (ids.length) wantImgs(ids, "t", "hubGalleryImages", [a.id]);
  }, { rootMargin: "900px 0px" }) : null;
  if (io) Array.prototype.forEach.call(grid.children, function(b) { if (b.querySelector("img[data-img]")) io.observe(b); });
  else wantImgs(a.photos.slice(0, 60), "t", "hubGalleryImages", [a.id]);
}
// ▶ Slideshow: a new photo every PHOTO_SHOW_MS. It waits (up to 4 more seconds) for the sharp copy of the next photo,
// so slides never arrive blurry. Pauses while the app is hidden. ⛶ = full screen (e.g. the class projector).
var PHOTO_SHOW_MS = 5000;
var VIEW = { i: 0, big: "l", play: false, t: null };
function canFs() { return !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen); }
function openViewer(i, play) {
  closeViewer(); VIEW.i = i; VIEW.play = !!play;
  VIEW.big = Math.min(window.innerWidth || 400, 2400) * (window.devicePixelRatio || 1) > 1300 ? "l" : "m";
  var v = document.createElement("div"); v.className = "viewer"; v.id = "viewer"; v.setAttribute("role", "dialog"); v.setAttribute("aria-modal", "true"); v.setAttribute("aria-label", "Photo viewer");
  v.innerHTML = '<div class="vbg" id="vBg"></div><div class="vbar" aria-hidden="true"><i id="vBar"></i></div><div class="viewer-top"><span><em id="vCount"></em></span>' +
    '<button id="vPlay" aria-label="Play slideshow">▶</button>' + (canFs() ? '<button id="vFs" aria-label="Full screen">⛶</button>' : '') +
    '<a id="vDl" class="hidden" download="photo.jpg">⬇ Save</a><button id="vX" aria-label="Close">✕</button></div>' +
    '<div class="stage"><div class="wm"><img id="vImg" alt="Class photo"></div></div><div class="turnhint hidden" id="vTurn">↻ Turn your phone sideways for a bigger photo</div><div class="protect-note">Class photos are for our class only. Please don’t screenshot or share them.</div><div class="nav"><button id="vPrev">‹ Back</button><button id="vNext">Next ›</button></div>';
  document.body.appendChild(v); document.body.style.overflow = "hidden";
  $("vX").onclick = closeViewer; $("vPrev").onclick = function() { showView(VIEW.i - 1); }; $("vNext").onclick = function() { showView(VIEW.i + 1); };
  $("vPlay").onclick = function() { setPlay(!VIEW.play); };
  if ($("vFs")) $("vFs").onclick = function() { toggleFs(v); };
  var sx = 0; v.addEventListener("touchstart", function(e) { sx = e.touches[0].clientX; }, { passive: true });
  v.addEventListener("touchend", function(e) { var dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 50) showView(VIEW.i + (dx < 0 ? 1 : -1)); });
  $("vImg").onload = fitPhoto;
  showView(i); setPlay(VIEW.play); $("vX").focus();
}
/** Makes the photo as big as the space allows (wide photos fill the width, tall ones the height), also on a sideways phone. */
function fitPhoto() {
  var img = $("vImg"), v = $("viewer"); if (!img || !v || !img.naturalWidth) return;
  var st = v.querySelector(".stage"), pad = window.innerHeight <= 540 && window.innerWidth > window.innerHeight ? 0 : 20;
  var W = Math.max(50, st.clientWidth - pad), H = Math.max(50, st.clientHeight - (pad ? 12 : 0));
  var s = Math.min(W / img.naturalWidth, H / img.naturalHeight, 6);
  img.style.width = Math.floor(img.naturalWidth * s) + "px"; img.style.height = Math.floor(img.naturalHeight * s) + "px";
  img.classList.add("fit");
  var th = $("vTurn");                                           // a wide photo on an upright phone: suggest turning it
  if (th) th.classList.toggle("hidden", !(window.innerWidth < 600 && window.innerHeight > window.innerWidth && img.naturalWidth > img.naturalHeight * 1.2));
}
window.addEventListener("resize", function() { if ($("viewer")) fitPhoto(); });
window.addEventListener("orientationchange", function() { setTimeout(fitPhoto, 300); });
function setPlay(on) {
  VIEW.play = !!on; clearTimeout(VIEW.t);
  var b = $("vPlay"); if (!b) return;
  b.textContent = on ? "⏸" : "▶"; b.setAttribute("aria-label", on ? "Pause slideshow" : "Play slideshow");
  $("viewer").classList.toggle("playing", VIEW.play);
  if (on) schedulePhoto();
  else { var bar = $("vBar"); if (bar) { bar.classList.remove("run"); bar.style.width = "0"; } }
}
function schedulePhoto() {
  clearTimeout(VIEW.t); if (!VIEW.play || !$("viewer")) return;
  var bar = $("vBar"); bar.classList.remove("run"); bar.style.width = ""; void bar.offsetWidth; bar.style.animationDuration = PHOTO_SHOW_MS + "ms"; bar.classList.add("run");
  VIEW.t = setTimeout(nextPhoto, PHOTO_SHOW_MS);
}
function nextPhoto(waited) {
  if (!VIEW.play || !$("viewer") || !S.album) return;
  if (document.hidden) { VIEW.t = setTimeout(function() { nextPhoto(waited); }, 1000); return; }
  var a = S.album, n = a.photos.length, k = (VIEW.i + 1) % n, nid = a.photos[k];
  if (!S.imgs[VIEW.big + nid] && (waited || 0) < 4000) {      // the sharp copy isn't here yet: give it a moment
    loadBig(a, nid); VIEW.t = setTimeout(function() { nextPhoto((waited || 0) + 400); }, 400); return;
  }
  showView(k);
}
function showView(i) {
  var a = S.album, n = a.photos.length; if (!n || !$("vImg")) return;
  VIEW.i = (i + n) % n; var id = a.photos[VIEW.i];
  $("vCount").textContent = (VIEW.i + 1) + " of " + n;
  var img = $("vImg"), small = S.imgs["t" + id] || S.imgs["s" + id], big = S.imgs[VIEW.big + id];
  img.setAttribute("data-want", id);
  img.src = big || small || ""; img.classList.toggle("soft", !big && !!small);
  if (small || big) $("vBg").style.backgroundImage = 'url("' + (small || big) + '")';
  var dl = $("vDl"); dl.classList.toggle("hidden", !(a.download && big)); if (big) dl.href = big;
  var show = function(pid) {
    if (!$("vImg") || $("vImg").getAttribute("data-want") !== pid) return;
    var u = S.imgs[VIEW.big + pid]; if (!u) return;
    $("vImg").src = u; $("vImg").classList.remove("soft");
    if (a.download) { dl.href = u; dl.classList.remove("hidden"); }
  };
  if (!small) wantImgs([id], "t", "hubGalleryImages", [a.id]);
  if (!big) loadBig(a, id, function() { show(id); });
  // the next photos (two ahead while the slideshow plays) and the previous one load quietly, so moving on feels instant
  (VIEW.play ? [VIEW.i + 1, VIEW.i + 2, VIEW.i - 1] : [VIEW.i + 1, VIEW.i - 1]).forEach(function(k) { var nid = a.photos[(k + n) % n]; if (!S.imgs["t" + nid] && !S.imgs["s" + nid]) wantImgs([nid], "t", "hubGalleryImages", [a.id]); if (!S.imgs[VIEW.big + nid]) loadBig(a, nid); });
  if (VIEW.play) schedulePhoto();
}
var BIG = {};
function loadBig(a, id, cb) {
  var sz = VIEW.big;
  if (S.imgs[sz + id]) { if (cb) cb(); return; }
  (BIG[id] = BIG[id] || []).push(cb || function() {});
  if (BIG[id].length > 1) return;
  api("hubGalleryImages", [HUB_KEY, S.token, a.id, [id], sz]).then(function(map) {
    return map[id] ? toUrl(map[id]).then(function(u) { S.imgs[sz + id] = u; }) : null;
  }).catch(function() {}).then(function() { var l = BIG[id] || []; delete BIG[id]; l.forEach(function(f) { f(); }); });
}
function closeViewer() {
  clearTimeout(VIEW.t); VIEW.play = false;
  var v = $("viewer"); if (!v) return;
  if (fsEl() === v) { try { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } catch (e) {} }
  v.parentNode.removeChild(v); document.body.style.overflow = "";
}
document.addEventListener("keydown", function(e) {
  if (!$("viewer")) return;
  if (e.key === "ArrowRight") showView(VIEW.i + 1); if (e.key === "ArrowLeft") showView(VIEW.i - 1);
  if (e.key === " " || e.key === "k") { e.preventDefault(); setPlay(!VIEW.play); }
  if (e.key === "Escape" && !fsEl()) closeViewer();
});
document.addEventListener("visibilitychange", function() { if (!document.hidden && S.tab === "ask" && S.token) loadMsgs(true); });

// ---------------- Teacher: printable PIN slips ----------------
function startSlips() {
  $("topTitle").textContent = "PIN slips";
  var s = document.createElement("script");
  s.src = "https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js";
  s.onload = function() { api("getHubSlips", [{ chat: "", key: DASH_KEY }]).then(renderSlips).catch(function(e) { fatal(e.message); }); };
  s.onerror = function() { fatal("Couldn't load the QR maker. Check the internet connection and reload."); };
  document.head.appendChild(s);
}
function renderSlips(d) {
  $("app").innerHTML = '<div class="card noprint"><b>Class Hub PIN slips</b><p class="muted" style="margin:6px 0 12px">Cut along the dashed lines and give each student their own slip. Untick any you don’t need. Each slip’s QR code opens the Class Hub; the PIN keeps each student’s account their own.</p>' +
    '<button class="btn primary" id="pr">🖨 Print slips</button> <button class="btn soft" id="none">Untick all</button></div>' +
    '<div class="slips" id="slips">' + d.students.map(function(s, i) {
      return '<div class="slip" id="sl' + i + '"><input type="checkbox" class="noprint" checked data-i="' + i + '" aria-label="Print slip for ' + esc(s.name) + '" style="width:22px;height:22px;align-self:flex-start">' +
        '<div class="qr" id="qr' + i + '"></div><div style="min-width:0"><h4>' + esc(s.name) + '</h4><div class="muted" style="font-size:11px">' + esc(d.className) + ' Class Hub · your PIN:</div><div class="pin">' + esc(s.pin) + '</div>' +
        '<ol><li>Scan the QR code</li><li>Tap your name</li><li>Type your PIN. Keep it secret!</li></ol>' +
        (/script\.google\.com/.test(d.url) ? '<p class="sliptip">Google says \u201cunable to open the file\u201d? Copy the link into a private / incognito tab.</p>' : '') + '</div></div>';
    }).join("") + '</div>';
  d.students.forEach(function(s, i) { new QRCode($("qr" + i), { text: d.url, width: 192, height: 192, correctLevel: QRCode.CorrectLevel.M }); });
  $("pr").onclick = function() { window.print(); };
  $("slips").onchange = function(e) { var c = e.target; if (c.dataset.i != null) $("sl" + c.dataset.i).classList.toggle("noprint", !c.checked); };
  $("none").onclick = function() {
    var boxes = document.querySelectorAll("#slips input"), any = Array.prototype.some.call(boxes, function(c) { return c.checked; });
    Array.prototype.forEach.call(boxes, function(c) { c.checked = !any; $("sl" + c.dataset.i).classList.toggle("noprint", any); });
    this.textContent = any ? "Tick all" : "Untick all";
  };
}

start();
</script>
